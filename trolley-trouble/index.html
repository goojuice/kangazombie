<script>
'use strict';
/* ======================== Trolley Trouble ======================== *
 * Push a trolley around a made-up Aussie village shopping centre,
 * tick off a picture-and-word list, then check out. A cheeky bin
 * chicken may nick the last item — ring the bell, zoom past, or
 * chase it back. Comedy only, never a crash. */

const TITLE = 'Trolley Trouble';  // official working title — swap this one string to rename
document.title = TITLE;
const MAPW = 2200, MAPH = 1500;
const CONFIG = {
  itemPts: 100, quickMax: 40, checkoutPts: 50, nobump: 40, shooBonus: 25, finishBonus: 200,
  shopperPenalty: 20, shopperTime: 2, wallPenalty: 8,
  holdCollect: 0.4, holdCheckout: 0.45,
  trolleyL: 52, trolleyW: 32,
  bellCool: 1.15, ibisFirst: 4.5, ibisCool: 9, shooRange: 150, stealRange: 42, zoomShoo: 88,
  /* Medal thresholds, set by Bruno Build KZ Engineering for this private preview
     (17 Nov 2026). Same in Little Kids. Review after a real phone/iPad play.
     A near-perfect 12-item run (3+4+5) with tidy speed bonuses, three clean
     checkouts, a few bell shoos and the +200 finish is about 2000–2200.
     Gold 1600 is about 75–80% of that (a clean full run that can miss a few quick bonuses).
     Silver 1000 is a tidy Saturday Morning plus Rainy Arvo (7 items) with a couple of bumps.
     Bronze 400 is a tidy Saturday Morning (3 items and a checkout, maybe one bump). */
  medals: [ { id: 'bronze', name: 'Bronze', at: 400 }, { id: 'silver', name: 'Silver', at: 1000 }, { id: 'gold', name: 'Gold', at: 1600 } ]
};
const LEVELS = [
  { id: 'saturday', name: 'Saturday Morning', items: ['bread', 'apples', 'sausages'], time: 70, shoppers: 7, ibis: 1, slip: 0, xmas: false, rain: false },
  { id: 'rainy', name: 'Rainy Arvo', items: ['carrots', 'paper', 'bandaids', 'bread'], time: 75, shoppers: 9, ibis: 1, slip: 0.22, xmas: false, rain: true },
  { id: 'christmas', name: 'Christmas Eve Rush', items: ['ham', 'gingerbread', 'cherries', 'cards', 'bandaids'], time: 80, shoppers: 11, ibis: 2, slip: 0, xmas: true, rain: false }
];
const THEMES = [
  { id: 'hills', name: 'Hills Village', brick: '#c45c48', brick2: '#b04e3c', trim: '#f3d27a', roof: '#6b2b2b',
    trolley: '#ffd23a', trolley2: '#ff9f1c', sky0: '#8ec8ff', sky1: '#d7eefe', floor: '#e8d7b8', floor2: '#d9c4a0',
    plant: '#5aa83b', centreName: 'HILLS VILLAGE' },
  { id: 'harbour', name: 'Harbour Markets', brick: '#6d8ba8', brick2: '#5c7a96', trim: '#f4e2c0', roof: '#3d4a5c',
    trolley: '#3ec6c9', trolley2: '#1e8f9a', sky0: '#9ad4e8', sky1: '#e8f4fa', floor: '#e6dcc8', floor2: '#d0c4ae',
    plant: '#6fa644', centreName: 'HARBOUR MARKETS' }
];
const SHOPS = [
  { id: 'fruit', name: "Pippa's Fruit Shop", short: 'Fruit', wall: '#e07a4a', wall2: '#c45c32', sign: '#fff4d6' },
  { id: 'bakery', name: 'Loaf & Laugh Bakery', short: 'Bakery', wall: '#f3d27a', wall2: '#e0b84c', sign: '#fff8e8' },
  { id: 'butcher', name: 'Chook & Co Butcher', short: 'Butcher', wall: '#e8a0a8', wall2: '#c96b76', sign: '#fff0f2' },
  { id: 'chemist', name: 'Quick-as-a-Wink Chemist', short: 'Chemist', wall: '#8fd4c8', wall2: '#5aaea0', sign: '#f0fffb' },
  { id: 'news', name: 'The Village Newsagent', short: 'Newsagent', wall: '#8ab0d4', wall2: '#5c86b0', sign: '#eef5ff' }
];
const ITEMS = {
  apples:      { name: 'Apples',      shop: 'fruit',   cols: ['#e23b3b', '#3fae2a'] },
  cherries:    { name: 'Cherries',    shop: 'fruit',   cols: ['#c81e3a', '#3fae2a'] },
  carrots:     { name: 'Carrots',     shop: 'fruit',   cols: ['#ff8a1a', '#3fae2a'] },
  bread:       { name: 'Bread',       shop: 'bakery',  cols: ['#e0a04a', '#f3d27a'] },
  gingerbread: { name: 'Gingerbread', shop: 'bakery',  cols: ['#a86a32', '#fff4d6'] },
  sausages:    { name: 'Sausages',    shop: 'butcher', cols: ['#c45c48', '#8a3a30'] },
  ham:         { name: 'Ham',         shop: 'butcher', cols: ['#e07a8a', '#f4c4cc'] },
  bandaids:    { name: 'Band-aids',   shop: 'chemist', cols: ['#e8c878', '#fff4d6'] },
  paper:       { name: 'Paper',       shop: 'news',    cols: ['#f6f1e4', '#7aa0c8'] },
  cards:       { name: 'Cards',       shop: 'news',    cols: ['#c81e3a', '#2e8b4a'] }
};

const hook = name => { try { window.kzHooks && window.kzHooks[name] && window.kzHooks[name](); } catch (e) {} };
const store = {
  get(k, d) { try { const v = localStorage.getItem('trolleyTrouble.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('trolleyTrouble.' + k, JSON.stringify(v)); } catch (e) {} }
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const angNorm = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
const angDiff = (a, b) => Math.abs(angNorm(a - b));
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const theme = () => THEMES[G.themeIx % THEMES.length];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const keys = {}, pads = { go: false, rev: false, steer: 0, wheelHeld: false, bell: false };
const G = {
  phase: 'title', t: 0, W: 1280, H: 720, cam: { x: 1100, y: 700 }, L: {},
  score: 0, best: store.get('best', 0), time: 0, level: 0, bumps: 0, tripBumps: 0,
  sound: store.get('sound', true) !== false, littleKids: false, themeIx: store.get('themeIx', 0),
  usePads: false, paused: false, test: false, nav: null,
  trolley: null, shoppers: [], ibises: [], list: [], basket: [], stolen: null,
  collectHold: 0, checkoutHold: 0, bellCool: 0, hint: '', hintT: 0,
  itemsGot: 0, shoos: 0, bells: 0, checkouts: 0, recovers: 0, perfects: 0,
  endWhy: '', map: null
};
if (window.kzPause) kzPause.onChange(p => { G.paused = p; hook(p ? 'gameplayStop' : 'gameplayStart'); });

function resize() {
  const cw = innerWidth, ch = innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = cw * dpr; cv.height = ch * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (cw >= ch) { G.H = 540; G.W = Math.round(540 * cw / ch); } else { G.W = 540; G.H = Math.round(540 * ch / cw); }
  G.L.port = G.H > G.W;
  G.L.hudY = G.L.port ? Math.max(118, 66 * G.H / innerHeight + 34) : 34;
  G.L.showPads = G.phase === 'play' && (G.usePads || G.L.port || cw < 900);
  syncPads();
}
function updateCam(dt) {
  const c = G.trolley, cam = G.cam, look = G.phase === 'title' ? titleLook() : (c ? { x: c.x, y: c.y } : cam);
  const dx = look.x - cam.x, dy = look.y - cam.y;
  const zx = G.W * 0.18, zy = G.H * 0.16;
  let tx = cam.x, ty = cam.y;
  if (Math.abs(dx) > zx) tx = look.x - Math.sign(dx) * zx;
  if (Math.abs(dy) > zy) ty = look.y - Math.sign(dy) * zy;
  const k = 1 - Math.exp(-(G.phase === 'title' ? 1.4 : 4.2) * dt);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  const mx = G.W / 2, my = G.H / 2;
  cam.x = clamp(cam.x, mx, MAPW - mx); cam.y = clamp(cam.y, my, MAPH - my);
}
function titleLook() { return { x: 1100 + Math.sin(G.t * 0.18) * 420, y: 360 + Math.cos(G.t * 0.14) * 30 }; }
function viewToWorld(x, y) { return { x: x + G.cam.x - G.W / 2, y: y + G.cam.y - G.H / 2 }; }
function worldToView(x, y) { return { x: x - G.cam.x + G.W / 2, y: y - G.cam.y + G.H / 2 }; }

function buildMap() {
  const M = { solids: [], shops: [], plants: [], bins: [], benches: [], wet: [], signs: [], tiles: [] };
  const solid = (x, y, w, h, kind) => M.solids.push({ x, y, w, h, kind: kind || 'wall' });
  // outer walls
  solid(-40, -40, MAPW + 80, 80); solid(-40, MAPH - 40, MAPW + 80, 80);
  solid(-40, 0, 80, MAPH); solid(MAPW - 40, 0, 80, MAPH);
  const shopW = 380, shopH = 260, shopY = 40, gap = 20, startX = 80;
  SHOPS.forEach((s, i) => {
    const x = startX + i * (shopW + gap);
    const doorX = x + shopW / 2, doorW = 90;
    solid(x, shopY, shopW, shopH - 8, 'shop');
    // a little verandah post either side of the door (player stays in the concourse)
    solid(x, shopY + shopH - 8, (shopW - doorW) / 2, 16, 'shop');
    solid(x + shopW - (shopW - doorW) / 2, shopY + shopH - 8, (shopW - doorW) / 2, 16, 'shop');
    M.shops.push({
      ...s, x, y: shopY, w: shopW, h: shopH,
      cx: doorX, cy: shopY + shopH + 70,
      zone: { x: doorX, y: shopY + shopH + 55, r: 78 }
    });
  });
  // central fountain / planter
  solid(1000, 680, 160, 160, 'planter');
  M.plants.push({ x: 1080, y: 760, r: 70, kind: 'fountain' });
  // side planters and benches
  [[280, 760, 90, 70], [1880, 760, 90, 70], [620, 980, 80, 60], [1500, 980, 80, 60]].forEach(([x, y, w, h]) => {
    solid(x - w / 2, y - h / 2, w, h, 'planter'); M.plants.push({ x, y, r: w * 0.45, kind: 'bush' });
  });
  M.benches.push({ x: 400, y: 760 }, { x: 1760, y: 760 }, { x: 1080, y: 980 });
  M.bins.push({ x: 240, y: 620 }, { x: 1920, y: 620 }, { x: 800, y: 1000 }, { x: 1360, y: 1000 });
  // checkout "The Tills"
  const cx = 1680, cy = 1240, cw = 320, ch = 180;
  solid(cx - cw / 2, cy - ch / 2, cw, ch - 20, 'checkout');
  M.checkout = { x: cx, y: cy - 20, w: cw, h: ch, zone: { x: cx - 40, y: cy - 130, r: 90 } };
  // wet-floor patches in the concourse
  M.wet.push({ x: 700, y: 620, w: 180, h: 110 }, { x: 1280, y: 820, w: 200, h: 120 }, { x: 480, y: 1000, w: 160, h: 90 });
  G.map = M;
  return M;
}
function shopById(id) { return G.map.shops.find(s => s.id === id); }
function itemById(id) { return ITEMS[id]; }
function remainingList() { return G.list.filter(it => !it.got && !it.stolen); }
function nextNeeded() { return remainingList()[0] || null; }
function basketCount() { return G.basket.length; }

function makeTrolley(x, y, a) {
  const th = theme();

function placeTrolley(x, y, a) { if (!G.trolley) spawnPlayer(); G.trolley.x = x; G.trolley.y = y; G.trolley.a = a; G.trolley.spd = 0; }
function maxSpd() { return G.littleKids ? 140 : 210; }
function onWet(t) {
  if (!G.map || !LEVELS[G.level].slip) return false;
  return G.map.wet.some(w => Math.abs(t.x - w.x) < w.w / 2 && Math.abs(t.y - w.y) < w.h / 2);
}
function applyDrive(dt, throttle, steer) {
  const t = G.trolley; if (!t) return;
  const slip = onWet(t) ? LEVELS[G.level].slip : 0;
  const acc = (G.littleKids ? 320 : 520) * (1 - slip * 0.5);
  const fric = (throttle === 0 ? 3.2 : 1.1) * (1 - slip * 0.7);
  const turn = (G.littleKids ? 2.1 : 2.6) * (1 - slip * 0.35);
  if (throttle) t.spd += throttle * acc * dt;
  t.spd *= Math.exp(-fric * dt);

  t.a += steer * turn * Math.sign(t.spd || throttle) * Math.min(1, Math.abs(t.spd) / 40) * dt * steerMul;
  const ox = t.x, oy = t.y;
  t.x += Math.cos(t.a) * t.spd * dt; t.y += Math.sin(t.a) * t.spd * dt;
  if (slip > 0 && Math.abs(t.spd) > 40) { t.x += Math.cos(t.a + 1.2) * slip * t.spd * 0.08 * dt; }

  t.squash = lerp(t.squash, clamp(Math.abs(t.spd) / 400, 0, 0.18), 1 - Math.exp(-8 * dt));

  for (const s of G.map.solids) {
    const nx = clamp(t.x, s.x, s.x + s.w), ny = clamp(t.y, s.y, s.y + s.h);
    const dx = t.x - nx, dy = t.y - ny, d = Math.hypot(dx, dy), rad = 22;
    if (d < rad && d > 0.01) {

function spawnShoppers(n) {

  for (let i = 0; i < n; i++) {
    const x = 200 + Math.random() * 1800, y = 500 + Math.random() * 600;
    G.shoppers.push({ x, y, tx: x, ty: y, vx: 0, vy: 0, a: 0, state: 'walk', st: 0, inv: 0, hop: 0,
      col: cols[i % cols.length][0], col2: cols[i % cols.length][1], bag: i % 2 === 0, umb: LEVELS[G.level].rain && i % 2 === 0 });
    pickShopperWalk(G.shoppers[i]);

}
function pickShopperWalk(s) {
  s.tx = clamp(200 + Math.random() * 1800, 160, MAPW - 160);

}
function updateShoppers(dt) {
  const t = G.trolley;

    } else if (s.state === 'walk') {
      const dx = s.tx - s.x, dy = s.ty - s.y, d = Math.hypot(dx, dy);
      if (d < 12 || s.st > 6) pickShopperWalk(s);

        const spd = 55 + (s.bag ? 0 : 15);

        t.inv = 0.7; t.squash = 0.22;

        Juice.pop(s.x, s.y - 58, 'Hey!', '#fff', 28, 0.9);

}

function spawnIbis(i) {

function ibisToward(b, tx, ty, spd, dt) {

  const wantX = dx / d * spd, wantY = dy / d * spd;
  b.vx += (wantX - b.vx) * 4 * dt; b.vy += (wantY - b.vy) * 4 * dt;
  b.x += b.vx * dt; b.y += b.vy * dt;

function stealRear() {
  const t = G.trolley; return { x: t.x - Math.cos(t.a) * 36, y: t.y - Math.sin(t.a) * 36 };
}
function trySteal(b) {

function updateIbis(dt) {
  const t = G.trolley; if (!t) return;
  for (const b of G.ibises) {
    b.st += dt; b.hop = Math.max(0, b.hop - dt); b.wing = (b.wing || 0) + dt * (b.state === 'shooed' || b.state === 'flee' ? 18 : 6);

    } else if (b.state === 'sneak') {

  G.score = 0; G.bumps = 0; G.shopperBumps = 0; G.steals = 0; G.shoos = 0; G.bells = 0;

  spawnShoppers(L.shoppers + (G.littleKids ? -2 : 0));

function tryCollect(dt) {
  const t = G.trolley, need = remainingList();

  let hit = null;
  for (const it of need) {
    const sh = shopById(it.shop);
    if (sh && dist(t.x, t.y, sh.zone.x, sh.zone.y) < sh.zone.r && Math.abs(t.spd) < 70) { hit = { it, sh }; break; }
  }
  if (!hit) { G.collectHold = 0; return null; }
  G.collectHold += dt;
  if (Math.abs(t.spd) > 12) t.spd *= Math.exp(-6 * dt); // arcade settle
  if (G.collectHold >= CONFIG.holdCollect) {
    const { it, sh } = hit;
    it.got = true; G.basket.push(it); G.itemsGot++;
    G.collectHold = 0; G.tripT = 0;
    const quick = Math.max(0, Math.round(CONFIG.quickMax - G.tripT * 1.2));
    const pts = CONFIG.itemPts + quick;
    G.score += pts;
    Juice.pop(t.x, t.y - 64, 'Got it!', '#fff', 26, 1);
    Juice.pop(t.x + 36, t.y - 96, '+' + pts, '#ffe11a', 22, 1);

const medalFor = s => { let m = null; for (const x of CONFIG.medals) if (s >= x.at) m = x; return m; };
function daily() {
  const opts = [
    { txt: 'Check out on Saturday Morning', check: g => g.checkouts >= 1 },
    { txt: 'Shoo a bin chicken', check: g => g.shoos >= 1 },
    { txt: 'Tick off 6 items', check: g => g.itemsGot >= 6 },
    { txt: 'Ring the trolley bell 3 times', check: g => g.bells >= 3 }
  ];
  const i = (new Date().getDate() + 2) % opts.length;
  return store.get('daily-' + todayKey(), false) ? { txt: opts[i].txt + ' (done!)', check: () => true } : opts[i];
}

function step(dt) {
  dt = Math.min(0.05, dt);
  G.t += dt;
  Juice.update(dt);
  if (G.paused) return;
  if (Juice.frozen()) return;
  if (G.phase === 'title') { updateCam(dt); return; }
  if (G.phase !== 'play') return;
  if (G.levelFlash > 0) G.levelFlash -= dt;
  const ctrl = readControls(dt);
  applyDrive(dt, ctrl.throttle, ctrl.steer);
  updateShoppers(dt);
  updateTrip(dt);
  updateIbis(dt);
  updateCam(dt);
  G.time -= dt;
  if (G.hintT > 0) G.hintT -= dt;
  if (G.time <= 0) endRound('time');
}

const Juice = (() => {

  for (let i = 0; i < POOL; i++) parts.push({ on: false });
