pause:function(){if(P.paused)return;P.paused=true;ov.classList.add('on');fns.forEach(function(f){f(true)})},
resume:function(){if(!P.paused)return;P.paused=false;ov.classList.remove('on');fns.forEach(function(f){f(false)})}};
function stop(e){e.stopPropagation()}['pointerdown','touchstart','mousedown'].forEach(function(t){document.getElementById('kzPause').addEventListener(t,stop);ov.addEventListener(t,stop)});
document.getElementById('kzPause').onclick=function(){P.paused?P.resume():P.pause()};document.getElementById('kzResume').onclick=function(){P.resume()};
document.addEventListener('visibilitychange',function(){if(document.hidden)P.pause()});addEventListener('pagehide',function(){P.pause()});

<script>
'use strict';
/* ======================== Trolley Trouble ======================== *
 * Supermarket edition. Push a trolley through a made-up corner
 * supermarket with a few wide, colour-coded aisles, tick off a
 * picture-and-word list, then pick a checkout lane (shortest queue =
 * bonus). The bin chicken sneaks in through Receiving and may nick the
 * last item: ring the bell, zoom past, or chase it back. Comedy only. */

const TITLE = 'Trolley Trouble';  // official working title — swap this one string to rename
document.title = TITLE;
const MAPW = 2000, MAPH = 1300;
const CONFIG = {
  itemPts: 100, quickMax: 40, checkoutPts: 50, nobump: 40, shooBonus: 25, finishBonus: 200,
  shortQueue: 30, itemTime: 3, speedyT: 7,
  shopperPenalty: 20, shopperTime: 2, wallPenalty: 8,
  holdCollect: 0.25, holdCheckout: 0.35, collectMaxSpd: 120, zoneR: 85,
  trolleyL: 52, trolleyW: 32, trolleyR: 22,
  bellCool: 1.15, ibisFirst: 5, ibisCool: 9, shooRange: 150, stealRange: 42, zoomShoo: 88,
  /* Medal thresholds, retuned for the supermarket redesign by Bruno Build KZ Engineering (19 Nov 2026)
     from driving-bot runs (5 seeds each, all three levels):
       clean & quick (short queues, bell)   1978–2341  -> Gold 1950
       ordinary (random lane, no bell, dawdles) 1809–1937 full run, 748 when it stalls -> Silver 1100
       slow / messy (only gets part of a list)  ~60–350  -> Bronze 300 (about 3 items)
     Same in Little Kids. Review after a real phone/iPad play. */
  medals: [ { id: 'bronze', name: 'Bronze', at: 300 }, { id: 'silver', name: 'Silver', at: 1100 }, { id: 'gold', name: 'Gold', at: 1950 } ]
};
/* Short, quick levels: a tidy kid finishes each in about 30–45 seconds. */
const LEVELS = [
  { id: 'saturday', name: 'Saturday Morning', items: ['bread', 'apples', 'milk'], time: 60, shoppers: 4, ibis: 1, slip: 0, xmas: false, rain: false },
  { id: 'rainy', name: 'Rainy Arvo', items: ['carrots', 'juice', 'bandaids', 'sausages'], time: 65, shoppers: 5, ibis: 1, slip: 0.22, xmas: false, rain: true },
  { id: 'christmas', name: 'Christmas Eve Rush', items: ['ham', 'gingerbread', 'cherries', 'cards', 'icecream'], time: 75, shoppers: 6, ibis: 2, slip: 0, xmas: true, rain: false }
];
const THEMES = [
  { id: 'hills', name: 'Hills Village', brick: '#c45c48', brick2: '#b04e3c', trim: '#f3d27a', roof: '#6b2b2b',
    trolley: '#ffd23a', trolley2: '#ff9f1c', sky0: '#8ec8ff', sky1: '#d7eefe', floor: '#f1e6cf', floor2: '#e6d6b6',
    plant: '#5aa83b', centreName: 'HILLS VILLAGE FRESH' },
  { id: 'harbour', name: 'Harbour Markets', brick: '#6d8ba8', brick2: '#5c7a96', trim: '#f4e2c0', roof: '#3d4a5c',
    trolley: '#3ec6c9', trolley2: '#1e8f9a', sky0: '#9ad4e8', sky1: '#e8f4fa', floor: '#eef0ea', floor2: '#dde3da',
    plant: '#6fa644', centreName: 'HARBOUR MARKETS FRESH' }
];
/* Supermarket sections (kept under the old SHOPS name so the shared API still works). */
const SHOPS = [
  { id: 'bakery',   name: 'Bakery',          short: 'Bakery',      col: '#f6c95c', col2: '#d99a2b' },
  { id: 'frozen',   name: 'Frozen',          short: 'Frozen',      col: '#9fe0f8', col2: '#3f9fd4' },
  { id: 'dairy',    name: 'Dairy',           short: 'Dairy',       col: '#fbfbff', col2: '#7f9ad8' },
  { id: 'bulk',     name: 'Bulk Bins',       short: 'Bulk',        col: '#e0bd93', col2: '#a8794a' },
  { id: 'produce',  name: 'Fruit & Veg',     short: 'Fruit & Veg', col: '#9be07a', col2: '#43a62e' },
  { id: 'hotbar',   name: 'Hot Bar & Deli',  short: 'Hot Bar',     col: '#ffa286', col2: '#d8573a' },
  { id: 'drinks',   name: 'Drinks & Juice',  short: 'Drinks',      col: '#ffb8e3', col2: '#d4519f' },
  { id: 'health',   name: 'Health & Beauty', short: 'Health',      col: '#c4b6ff', col2: '#7059d6' },
  { id: 'seasonal', name: 'Seasonal',        short: 'Seasonal',    col: '#ff8080', col2: '#c81e3a' }
];
const SECTIONS = SHOPS;
const ITEMS = {
  apples:      { name: 'Apples',      shop: 'produce',  cols: ['#e23b3b', '#3fae2a'] },
  cherries:    { name: 'Cherries',    shop: 'produce',  cols: ['#c81e3a', '#3fae2a'] },
  carrots:     { name: 'Carrots',     shop: 'produce',  cols: ['#ff8a1a', '#3fae2a'] },
  bread:       { name: 'Bread',       shop: 'bakery',   cols: ['#e0a04a', '#f3d27a'] },
  gingerbread: { name: 'Gingerbread', shop: 'bakery',   cols: ['#a86a32', '#fff4d6'] },
  sausages:    { name: 'Sausages',    shop: 'hotbar',   cols: ['#c45c48', '#8a3a30'] },
  ham:         { name: 'Ham',         shop: 'hotbar',   cols: ['#e07a8a', '#f4c4cc'] },
  bandaids:    { name: 'Band-aids',   shop: 'health',   cols: ['#e8c878', '#fff4d6'] },
  cards:       { name: 'Cards',       shop: 'seasonal', cols: ['#c81e3a', '#2e8b4a'] },
  milk:        { name: 'Milk',        shop: 'dairy',    cols: ['#ffffff', '#4da3ff'] },
  icecream:    { name: 'Ice Cream',   shop: 'frozen',   cols: ['#ffb3c6', '#e0a04a'] },
  juice:       { name: 'Juice',       shop: 'drinks',   cols: ['#ff9f1c', '#3fae2a'] },
  lollies:     { name: 'Lollies',     shop: 'bulk',     cols: ['#ff7ad9', '#ffe11a'] }
};


const hook = name => { try { window.kzHooks && window.kzHooks[name] && window.kzHooks[name](); } catch (e) {} };
const store = {
  get(k, d) { try { const v = localStorage.getItem('trolleyTrouble.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('trolleyTrouble.' + k, JSON.stringify(v)); } catch (e) {} }
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const angNorm = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
const angDiff = (a, b) => Math.abs(angNorm(a - b));
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const theme = () => THEMES[G.themeIx % THEMES.length];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const keys = {}, pads = { go: false, rev: false, steer: 0, wheelHeld: false, bell: false };
const G = {
  phase: 'title', t: 0, W: 1280, H: 720, cam: { x: 1100, y: 700 }, L: {},
  score: 0, best: store.get('best', 0), time: 0, level: 0, bumps: 0, tripBumps: 0,
  sound: store.get('sound', true) !== false, littleKids: false, themeIx: store.get('themeIx', 0),
  usePads: false, paused: false, test: false, nav: null,
  trolley: null, shoppers: [], ibises: [], list: [], basket: [], stolen: null,
  collectHold: 0, checkoutHold: 0, bellCool: 0, hint: '', hintT: 0,
  itemsGot: 0, shoos: 0, bells: 0, checkouts: 0, recovers: 0, perfects: 0,
  endWhy: '', map: null
};
if (window.kzPause) kzPause.onChange(p => { G.paused = p; hook(p ? 'gameplayStop' : 'gameplayStart'); });

function resize() {
  const cw = innerWidth, ch = innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = cw * dpr; cv.height = ch * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const base = G.overview ? MAPH : (G.viewH || 540); // overview = whole-store preview for screenshots
  if (cw >= ch) { G.H = base; G.W = Math.round(base * cw / ch); } else { G.W = base; G.H = Math.round(base * ch / cw); }
  G.L.port = G.H > G.W;
  G.L.hudY = G.L.port ? Math.max(118, 66 * G.H / innerHeight + 34) : 34;
  G.L.showPads = G.phase === 'play' && (G.usePads || G.L.port || cw < 900);
  // world units hidden under the touch controls at the bottom of the screen
  G.L.padH = G.L.port ? 200 * G.H / ch : ((G.usePads || cw < 900) ? 90 * G.H / ch : 0);
  syncPads();
}
function updateCam(dt) {
  const c = G.trolley, cam = G.cam, padH = G.phase === 'play' ? (G.L.padH || 0) : 0, topH = G.phase === 'play' && G.L.port ? (G.L.hudY || 0) + 40 : 0;
  // keep the trolley above the touch controls: aim the camera a little below it
  const look = G.phase === 'title' ? titleLook() : (c ? { x: c.x, y: c.y + padH * 0.5 - topH * 0.25 } : cam);
  const dx = look.x - cam.x, dy = look.y - cam.y;
  const zx = G.W * 0.18, zy = G.H * 0.16;
  let tx = cam.x, ty = cam.y;
  if (Math.abs(dx) > zx) tx = look.x - Math.sign(dx) * zx;
  if (Math.abs(dy) > zy) ty = look.y - Math.sign(dy) * zy;
  const k = 1 - Math.exp(-(G.phase === 'title' ? 1.4 : 4.2) * dt);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  const mx = G.W / 2, my = G.H / 2;
  // the camera may scroll past the store edges by the height of the HUD / touch controls,
  // so the back wall and the tills can sit in the clear part of the screen
  cam.x = clamp(cam.x, mx, MAPW - mx); cam.y = clamp(cam.y, my - topH, MAPH - my + padH);
}
function titleLook() { return { x: 1000 + Math.sin(G.t * 0.18) * 520, y: 640 + Math.cos(G.t * 0.14) * 260 }; }
function viewToWorld(x, y) { return { x: x + G.cam.x - G.W / 2, y: y + G.cam.y - G.H / 2 }; }
function worldToView(x, y) { return { x: x - G.cam.x + G.W / 2, y: y - G.cam.y + G.H / 2 }; }

function buildMap() {
  const M = { solids: [], shops: [], gondolas: [], bins: [], wet: [], lanes: [], walks: [] };
  const solid = (x, y, w, h, kind, extra) => { const s = Object.assign({ x, y, w, h, kind: kind || 'wall' }, extra || {}); M.solids.push(s); return s; };
  // outer walls (floor is 40..1960 x 40..1260)
  solid(-40, -40, MAPW + 80, 80); solid(-40, MAPH - 40, MAPW + 80, 80);
  solid(-40, 0, 80, MAPH); solid(MAPW - 40, 0, 80, MAPH);
  const R = CONFIG.zoneR;
  const sec = (id, rect, zx, zy, face) => {
    const d = SHOPS.find(s => s.id === id);
    const s = solid(rect[0], rect[1], rect[2], rect[3], rect[4] || 'counter', { sec: id });
    const o = Object.assign({}, d, { x: s.x, y: s.y, w: s.w, h: s.h, face, cx: zx, cy: zy, zone: { x: zx, y: zy, r: R }, solid: s });
    M.shops.push(o); return o;
  };
  // back wall: Bakery, Frozen, Dairy, Bulk (like the plan's Grab + Go / Frozen / Dairy / Bulk)
