pause:function(){if(P.paused)return;P.paused=true;ov.classList.add('on');fns.forEach(function(f){f(true)})},
resume:function(){if(!P.paused)return;P.paused=false;ov.classList.remove('on');fns.forEach(function(f){f(false)})}};
function stop(e){e.stopPropagation()}['pointerdown','touchstart','mousedown'].forEach(function(t){document.getElementById('kzPause').addEventListener(t,stop);ov.addEventListener(t,stop)});
document.getElementById('kzPause').onclick=function(){P.paused?P.resume():P.pause()};document.getElementById('kzResume').onclick=function(){P.resume()};
document.addEventListener('visibilitychange',function(){if(document.hidden)P.pause()});addEventListener('pagehide',function(){P.pause()});
addEventListener('keydown',function(e){if(e.code==='Escape'&&P.paused){e.stopImmediatePropagation();P.resume()}},true);})();</script>

<script>
'use strict';
/* ======================== Scoop Scoop Hooray! ======================== *
 * The chooks are pooping on the pavers. Tap (or swipe) the plops to scoop
 * them into the bucket before the yard gets too messy. Faster and faster!
 * Glowing feed makes a glow-poo: scoop it while it blinks for a big bonus. */

/* ----------------------------- config + themes ----------------------------- */
const CONFIG = {
  roundTime: 60,
  scoopR: 44,            // tap radius in world px (Little Kids x1.4)
  pts: 10, freshPts: 5, freshTime: 1.5,
  comboWindow: 1.2,
  maxMess: 14, messGrace: 3,           // 14 piles on the pavers for 3 s = "Too messy!"
  kidsMaxMess: 18,
  chooks: 4, moreChooksAt: [40],    // a new chook joins at these seconds left
  roosterAt: 30,                        // Rocky the rooster struts in: double plops
  pooGap: [7, 3.2],                   // seconds between plops per chook, start -> end of round
  egg: { every: [11, 17], life: 4.5, pts: 50 },
  glow: { every: [9, 14], blink: 4.5, kidsBlink: 6.5, pts: 60 },
  spotless: 50,
  medals: [ { id: 'bronze', name: 'Bronze', at: 500 }, { id: 'silver', name: 'Silver', at: 1500 }, { id: 'gold', name: 'Gold', at: 3000 } ]   // from the tests.js bot sim
};
const THEMES = [
  { id: 'patio', name: 'Backyard', tile: '#e9a877', tile2: '#dc9466', grout: '#b9764c', grass: '#7ad04f', grass2: '#5fb83c', fence: '#ffffff',
    chooks: ['#ffffff', '#c8763a', '#2b2b38', '#f3d27a', '#ffffff', '#c8763a'] },
  { id: 'farm', name: 'Farmhouse', tile: '#a9b3bd', tile2: '#98a3ae', grout: '#77828e', grass: '#9bd24a', grass2: '#7cb83a', fence: '#c98a4b',
    chooks: ['#b0602a', '#ffffff', '#f3d27a', '#8a8a8a', '#b0602a', '#ffffff'] }
];

/* ad / portal seams (playbook #34): a portal SDK can hook these later. Nothing is sent anywhere. */
const hook = name => { try { window.kzHooks && window.kzHooks[name] && window.kzHooks[name](); } catch (e) {} };

/* ----------------------------- storage ----------------------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('scoopHooray.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('scoopHooray.' + k, JSON.stringify(v)); } catch (e) {} }
};
const littleKidsGet = () => { try { return localStorage.getItem('kzArcade.littleKids') === '1'; } catch (e) { return false; } };
const littleKidsSet = v => { try { localStorage.setItem('kzArcade.littleKids', v ? '1' : '0'); } catch (e) {} };

/* ----------------------------- state ----------------------------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const G = {
  phase: 'title', paused: false, sound: store.get('sound', true), themeIx: store.get('theme', 0) % THEMES.length,
  littleKids: littleKidsGet(), best: store.get('best', 0),
  W: 960, H: 540, L: {}, t: 0, time: 0, score: 0, combo: 0, lastScoop: -9, bestCombo: 0, scooped: 0, speedy: 0, eggsGot: 0, glowsGot: 0, taps: 0, misses: 0,
  chooks: [], poos: [], eggs: [], feeds: [], flyers: [], messT: 0, endWhy: '', aim: { x: 480, y: 300, show: false }, bucketSquash: 0, eggT: 12, glowT: 10, down: false, scoopAnim: 0
};
const theme = () => THEMES[G.themeIx];
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = () => clamp(1 - G.time / CONFIG.roundTime, 0, 1);   // 0 at start, 1 at the end
const maxMess = () => G.littleKids ? CONFIG.kidsMaxMess : CONFIG.maxMess;

/* ----------------------------- layout ----------------------------- */
let DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const cw = innerWidth, ch = innerHeight;
  cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
  if (cw >= ch) { G.H = 540; G.W = Math.round(540 * cw / ch); } else { G.W = 540; G.H = Math.round(540 * ch / cw); }
  const W = G.W, H = G.H, port = H > W, L = G.L;
  L.port = port;
  L.hudY = port ? Math.max(118, 66 * H / innerHeight + 34) : 34;
  L.y0 = port ? L.hudY + 40 : 92;               // top of the pavers (garden + fence above)
  L.y1 = H - (port ? 92 : 64);                  // bottom of the pavers (tidy meter below)
  L.x0 = 18; L.x1 = W - 18;
  L.tile = port ? 60 : 64;
  L.bucket = { x: W - (port ? 58 : 70), y: H - (port ? 52 : 40) };
  L.sc = port ? 1.1 : 1;
  L.coop = { x: port ? 96 : 210, y: L.y0 };
  G.aim.x = clamp(G.aim.x, L.x0, L.x1); G.aim.y = clamp(G.aim.y, L.y0, L.y1);
  for (const c of G.chooks) { c.x = clamp(c.x, L.x0 + 30, L.x1 - 30); c.y = clamp(c.y, L.y0 + 30, L.y1 - 10); }
}

/* ----------------------------- round ----------------------------- */
function startRound() {
  Object.assign(G, { phase: 'play', time: CONFIG.roundTime, score: 0, combo: 0, lastScoop: -9, bestCombo: 0, scooped: 0, speedy: 0, eggsGot: 0, glowsGot: 0, taps: 0, misses: 0,
    chooks: [], poos: [], eggs: [], feeds: [], flyers: [], messT: 0, peakMess: 0, endWhy: '', eggT: rnd(...CONFIG.egg.every), glowT: rnd(6, 9), added: 0, rooster: false });
  for (let i = 0; i < CONFIG.chooks; i++) spawnChook(false, i);
  Juice.clear(); G.comboPulse = 0; G.tutorial = !store.get('played', false) || G.littleKids;
  hook('gameplayStart');
  show('title', false); show('end', false);
  sfx('start');
}
function endRound(why) {
  if (G.phase !== 'play') return;
  G.phase = 'end'; G.endWhy = why || 'time'; store.set('played', true); hook('gameplayStop');
  let spot = 0; if (G.endWhy === 'time' && G.poos.length === 0) { spot = CONFIG.spotless; G.score += spot; }
  const md = medalFor(G.score), newBest = G.score > G.best;
  if (newBest) { G.best = G.score; store.set('best', G.best); }
  const dl = daily(), dk = 'daily-' + todayKey(), dDone = dl.check(G);
  if (dDone) store.set(dk, true);
  const head = G.endWhy === 'messy' ? 'Too messy!' : (newBest ? 'New best!' : 'Yard done!');
  document.getElementById('endCard').innerHTML =
    '<h2>' + head + '</h2>' +
    (G.endWhy === 'messy' ? '<h3 style="font-size:17px">The chooks won this time. Scoop faster!</h3>' : '') +
    (md ? '<div class="medal ' + md.id + '">★</div><h3>' + md.name + ' medal</h3>' : '<div class="medal none">★</div><h3>Bronze at ' + CONFIG.medals[0].at + '</h3>') +
    '<div class="stats"><span>Score</span><b>' + G.score + '</b><span>Plops scooped</span><b>' + G.scooped + '</b><span>Glow bonuses</span><b>' + G.glowsGot +
    '</b><span>Golden eggs</span><b>' + G.eggsGot + '</b><span>Best combo</span><b>x' + G.bestCombo + '</b>' + (spot ? '<span>Spotless yard</span><b>+' + spot + '</b>' : '') + '<span>Best ever</span><b>' + G.best + '</b></div>' +
    '<div class="row" style="gap:18px;margin-top:4px">' + CONFIG.medals.map(m => '<div style="font-size:14px"><div class="medal ' + (G.score >= m.at ? m.id : 'none') + '" style="width:40px;height:40px;font-size:18px;border-width:3px">★</div>' + m.at + '</div>').join('') + '</div>' +
    '<h3 style="font-size:17px">' + (dDone ? '✅ Daily goal done!' : 'Daily goal: ' + dl.txt) + '</h3>' +
    '<div class="row"><button class="btn green" id="bAgain">↻ Again</button><button class="btn pill" id="bHome">🏠 Menu</button></div>';
  show('end', true);
  document.getElementById('bAgain').onclick = startRound;
  document.getElementById('bHome').onclick = () => { show('end', false); G.phase = 'title'; G.poos = []; G.eggs = []; G.feeds = []; show('title', true); syncUI(); };
  sfx(G.endWhy === 'messy' ? 'messy' : 'fanfare');
}
const medalFor = s => { let m = null; for (const x of CONFIG.medals) if (s >= x.at) m = x; return m; };

/* daily goal: picked from the date, saved on this device only */
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const DAILIES = [
  { txt: 'Scoop 40 plops', check: g => g.scooped >= 40 },
  { txt: 'Get 2 glow bonuses', check: g => g.glowsGot >= 2 },
  { txt: 'Get a x5 combo', check: g => g.bestCombo >= 5 },
  { txt: 'Catch a golden egg', check: g => g.eggsGot >= 1 },
  { txt: 'Make 15 speedy scoops', check: g => g.speedy >= 15 }
];
function daily() { const k = todayKey(); let h = 0; for (const c of k) h = (h * 31 + c.charCodeAt(0)) | 0; return DAILIES[Math.abs(h) % DAILIES.length]; }

/* ----------------------------- chooks (state machine: walk / peck / plop / hop / glowEat) ----------------------------- */
const NAMES = ['Nugget', 'Pip', 'Henny', 'Dot', 'Clucky', 'Marge'];
function spawnChook(rooster, i) {
  const L = G.L, th = theme(), n = G.chooks.length;
  const fromCoop = G.phase === 'play' && G.time < CONFIG.roundTime - 1;
  const c = { x: fromCoop ? L.coop.x : rnd(L.x0 + 60, L.x1 - 60), y: fromCoop ? L.y0 + 24 : rnd(L.y0 + 40, L.y1 - 30), vx: 0, vy: 0, tx: 0, ty: 0,
    state: 'walk', st: 0, face: Math.random() < 0.5 ? -1 : 1, col: rooster ? '#ffffff' : th.chooks[n % th.chooks.length], rooster, name: rooster ? 'Rocky' : NAMES[n % NAMES.length],
    pooT: rnd(1.5, 4) + (i || 0) * 0.6, glow: 0, hic: 0, squash: 0, peckK: 0, bob: Math.random() * 6, plops: 0 };
  pickTarget(c); G.chooks.push(c); return c;
}
function pickTarget(c) { const L = G.L; c.tx = rnd(L.x0 + 40, L.x1 - 40); c.ty = rnd(L.y0 + 30, L.y1 - 20); }
function pooGap(c) { const g = lerp(CONFIG.pooGap[0], CONFIG.pooGap[1], prog()) * (G.littleKids ? 1.45 : 1) * (c.rooster ? 0.8 : 1); return g * rnd(0.75, 1.25); }
function updateChooks(dt) {
  const L = G.L;
  for (const c of G.chooks) {
    c.st += dt; c.squash = Math.max(0, c.squash - dt * 4); c.hic = Math.max(0, c.hic - dt); c.bob += dt;
    const spd = (c.rooster ? 95 : 60) * (G.littleKids ? 0.8 : 1);
    let dx = 0, dy = 0;
    if (c.state === 'walk' || c.state === 'hop' || c.state === 'toFeed') {
      if (c.state === 'toFeed' && c.feed) { c.tx = c.feed.x; c.ty = c.feed.y + 4; if (!G.feeds.includes(c.feed)) { c.state = 'walk'; c.feed = null; } }
      dx = c.tx - c.x; dy = c.ty - c.y; const d = Math.hypot(dx, dy) || 1;
      const sp = c.state === 'hop' ? spd * 2.2 : (c.state === 'toFeed' ? spd * 1.4 : spd);
      const k = Math.min(1, d / 40);                          // arrive: slow down near the target
      const wantX = dx / d * sp * k, wantY = dy / d * sp * k;
      c.vx += (wantX - c.vx) * Math.min(1, dt * 6); c.vy += (wantY - c.vy) * Math.min(1, dt * 6);
      if (d < (c.state === 'toFeed' ? 24 : 10)) {
        if (c.state === 'toFeed' && c.feed) { c.state = 'glowEat'; c.st = 0; }
        else if (c.state === 'hop') { c.state = 'walk'; pickTarget(c); }
        else if (Math.random() < 0.55) { c.state = 'peck'; c.st = 0; c.dur = rnd(0.8, 1.8); } else pickTarget(c);
      }
    } else { c.vx *= Math.pow(0.02, dt); c.vy *= Math.pow(0.02, dt); }
    for (const o of G.chooks) if (o !== c) { const ox = c.x - o.x, oy = c.y - o.y, od = Math.hypot(ox, oy); if (od < 40 && od > 0.1) { c.vx += ox / od * 140 * dt; c.vy += oy / od * 140 * dt; } }   // separation
    c.x = clamp(c.x + c.vx * dt, L.x0 + 26, L.x1 - 26); c.y = clamp(c.y + c.vy * dt, L.y0 + 20, L.y1 - 8);
    if (Math.abs(c.vx) > 6) c.face = c.vx > 0 ? 1 : -1;
    if (c.state === 'peck') { c.peckK = Math.max(0, Math.sin(c.st * 14)); if (c.st > c.dur) { c.state = 'walk'; c.peckK = 0; pickTarget(c); } }
    if (c.state === 'glowEat') { c.peckK = Math.max(0, Math.sin(c.st * 18));
      if (c.st > 0.9) { const f = c.feed; G.feeds = G.feeds.filter(q => q !== f); c.feed = null; c.glow = 1; c.hic = 0.5; c.state = 'walk'; c.peckK = 0; pickTarget(c); c.pooT = Math.min(c.pooT, rnd(1.4, 2.2));
        Juice.pop(c.x, c.y - 50, 'hic!', '#b6ff3b', 22, 0.8); Juice.burst(c.x, c.y - 30, 10, ['#b6ff3b', '#eaffa0', '#fff'], { shape: 'star', speed: 120, up: 80, g: 200, size: 4 }); sfx('hic'); } }
    if (c.state === 'plop') { if (c.st > 0.42) { layPoo(c); if (c.rooster && !c.second) { c.second = true; c.st = 0.15; } else { c.second = false; c.state = 'walk'; pickTarget(c); } } }

function drawHints() {
  // Little Kids: a soft ring on the oldest pile; first round: a hand + one-line hint
  if (G.littleKids && G.poos.length) { const p = G.poos.reduce((a, b) => (b.glow && !a.glow) || b.age > a.age ? b : a); const r = 30 + Math.sin(G.t * 6) * 4; ctx.beginPath(); ctx.arc(p.x, p.y - 8, r, 0, 7); ctx.setLineDash([7, 6]); ctx.lineWidth = 3.5; ctx.strokeStyle = '#fff'; ctx.stroke(); ctx.setLineDash([]); }
  if (G.tutorial && G.scooped < 3) {
    const p = G.poos[0], L = G.L;
    if (p) { const u = (G.t * 1.4) % 1; ctx.save(); ctx.globalAlpha = 1 - u; ctx.beginPath(); ctx.arc(p.x, p.y - 8, 16 + u * 30, 0, 7); ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke(); ctx.restore(); txt('Tap!', p.x, p.y + 26 + Math.sin(G.t * 6) * 3, 20, '#ffe11a'); }
    txt(G.L.port ? 'Tap the plops to scoop!' : 'Tap or swipe the plops to scoop them!', G.W / 2, L.y1 - 26, L.port ? 22 : 24, '#fff');
  }
}
function drawHUD() {
  const W = G.W, H = G.H, L = G.L, top = L.hudY;
  txt(String(G.score), W / 2, top, 40, '#ffe11a');
  G.comboPulse = Math.max(0, (G.comboPulse || 0) - 0.06);
  if (G.combo > 1) { ctx.save(); ctx.translate(W / 2, top + 36); const k = 1 + 0.35 * G.comboPulse; ctx.scale(k, k); txt('x' + Math.min(5, G.combo) + ' combo!', 0, 0, 20 + 2 * Math.min(5, G.combo), ['#fff', '#fff', '#7be36b', '#3ec5ff', '#ff9f1c', '#ff4d6d'][Math.min(5, G.combo)]); ctx.restore(); }
  // timer pill
  const tx = W - (L.port ? 62 : 124), ty = top - 1;
  const tp = G.time < 5.5 ? 1 + 0.12 * Math.max(0, 1 - (G.time % 1) * 4) : 1; ctx.save(); ctx.translate(tx, ty); ctx.scale(tp, tp); ctx.translate(-tx, -ty);
  ctx.beginPath(); ctx.roundRect(tx - 42, ty - 22, 84, 44, 22); olFill(G.time < 10 ? '#ff4d6d' : '#fff', 4);
  txt(Math.ceil(G.time) + 's', tx, ty + 1, 24, G.time < 10 ? '#fff' : '#ffe11a'); ctx.restore();
  // tidy meter: fills as piles stay on the pavers
  const mx = 20, my = H - (L.port ? 50 : 34), mw = Math.min(L.port ? W - 150 : 380, W - 150), mh = 26, n = G.poos.length, frac = Math.min(1, n / maxMess());
  const danger = G.messT > 0;
  ctx.beginPath(); ctx.roundRect(mx, my - mh / 2, mw, mh, 13); olFill('rgba(255,255,255,.9)', 4);
  if (frac > 0) { ctx.save(); ctx.beginPath(); ctx.roundRect(mx + 3, my - mh / 2 + 3, (mw - 6) * frac, mh - 6, 10); ctx.fillStyle = frac < 0.5 ? '#7be36b' : frac < 0.8 ? '#ffc928' : (danger && Math.sin(G.t * 20) > 0 ? '#ffffff' : '#ff4d6d'); ctx.fill(); ctx.restore(); }
  drawPoo(mx + 4, my + 13, 0.85, { age: 0, seed: 1 });
  txt(G.littleKids ? 'Mess ' + n : (danger ? 'Too messy! ' + Math.ceil(CONFIG.messGrace - G.messT) : 'Mess ' + n + '/' + maxMess()), mx + mw / 2 + 8, my + 1, 17, danger ? '#ff4d6d' : '#fff');
}
function drawLogo() {
  const W = G.W, y = G.H * (G.L.port ? 0.3 : 0.32), s = Math.min(1, W / 620);
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(s, s); ctx.rotate(-0.04 + Math.sin(G.t * 2) * 0.015);
  ctx.beginPath(); ctx.roundRect(-270, -92, 540, 200, 40); ctx.fillStyle = 'rgba(27,27,47,.28)'; ctx.fill();
  txt('Scoop Scoop', 0, -42, 56, '#fff'); txt('HOORAY!', 0, 22, 86, '#ffe11a');
  drawPoo(-215, 30, 2.2, { age: 0, seed: 1 }); drawPoo(222, 20, 1.8, { age: 1, glow: true, seed: 4 });
  txt('Keep the pavers tidy. The chooks have other plans!', 0, 84, 18, '#fff');
  ctx.restore();
}

/* ----------------------------- input: tap / click scoops, drag = swipe-scoop, keys move the scooper ----------------------------- */
function toWorld(e) { const rc = cv.getBoundingClientRect(); return { x: (e.clientX - rc.left) / rc.width * G.W, y: (e.clientY - rc.top) / rc.height * G.H }; }
cv.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); const p = toWorld(e); G.aim.x = p.x; G.aim.y = p.y; G.down = true; G.taps++; if (G.phase === 'play') scoopAt(p.x, p.y, false); });
cv.addEventListener('pointermove', e => { const p = toWorld(e); G.aim.x = p.x; G.aim.y = p.y; G.aim.show = e.pointerType === 'mouse'; if (G.down && G.phase === 'play') scoopAt(p.x, p.y, true); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, () => { G.down = false; }));
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true; audioInit();
  if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { e.preventDefault(); if (G.phase === 'play') scoopAt(G.aim.x, G.aim.y, false); else if (G.phase === 'title') startRound(); }
  if (e.code === 'KeyM') toggleSound();
  if (e.code === 'KeyP' && window.kzPause && G.phase === 'play') kzPause.paused ? kzPause.resume() : kzPause.pause();
});
addEventListener('keyup', e => keys[e.code] = false);
function keyAim(dt) {
  const v = 520 * dt; let m = false;
  if (keys.ArrowLeft || keys.KeyA) { G.aim.x -= v; m = true; } if (keys.ArrowRight || keys.KeyD) { G.aim.x += v; m = true; }
  if (keys.ArrowUp || keys.KeyW) { G.aim.y -= v; m = true; } if (keys.ArrowDown || keys.KeyS) { G.aim.y += v; m = true; }
  if (m) { G.aim.show = true; G.aim.x = clamp(G.aim.x, G.L.x0, G.L.x1); G.aim.y = clamp(G.aim.y, G.L.y0, G.L.y1); if (keys.Space && G.phase === 'play') scoopAt(G.aim.x, G.aim.y, true); }
}

/* ----------------------------- UI ----------------------------- */
const $ = id => document.getElementById(id);
function show(id, on) { $(id).classList.toggle('on', on); }
function toggleSound() { G.sound = !G.sound; store.set('sound', G.sound); if (G.sound) audioInit(); syncUI(); }
function syncUI() {
  $('snd').textContent = G.sound ? '🔊' : '🔇';
  $('bTheme').textContent = '🎨 ' + theme().name;
  $('bKids').textContent = '🐣 Little Kids: ' + (G.littleKids ? 'On' : 'Off'); $('bKids').classList.toggle('on', G.littleKids);
  $('dailyTxt').textContent = (store.get('daily-' + todayKey(), false) ? '✅ ' : '⭐ Today: ') + daily().txt + (G.best ? '   ·   Best: ' + G.best : '');
}
function titleYard() {   // a few chooks wander behind the title
  G.chooks = []; G.poos = []; for (let i = 0; i < 4; i++) spawnChook(false, i);
  G.poos.push({ x: G.L.x0 + (G.L.x1 - G.L.x0) * 0.22, y: G.L.y1 - 60, age: 9, glow: false, pop: 1, seed: 2 }, { x: G.L.x0 + (G.L.x1 - G.L.x0) * 0.78, y: G.L.y1 - 90, age: 0, glow: true, pop: 1, seed: 5 });
}
$('snd').onclick = toggleSound;
$('bPlay').onclick = () => { audioInit(); startRound(); };
$('bTheme').onclick = () => { G.themeIx = (G.themeIx + 1) % THEMES.length; store.set('theme', G.themeIx); titleYard(); syncUI(); };
$('bKids').onclick = () => { G.littleKids = !G.littleKids; littleKidsSet(G.littleKids); syncUI(); };
['pointerdown', 'touchstart', 'mousedown'].forEach(t => { for (const id of ['snd', 'title', 'end']) $(id).addEventListener(t, e => { if (e.target !== $('title')) e.stopPropagation(); }); });

let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  if (!G.paused && !G.test) { keyAim(dt); step(dt); }
  draw(); requestAnimationFrame(frame);
}
addEventListener('resize', resize); resize(); titleYard(); syncUI();
if (window.kzPause) kzPause.onChange(p => { G.paused = p; if (p) hook('gameplayStop'); else if (G.phase === 'play') hook('gameplayStart'); });
window.TT = { G, step, draw, startRound, endRound, scoopAt, spawnChook, layPoo, resize, CONFIG, THEMES };
requestAnimationFrame(frame);
</script>
