const CONFIG = {

const LEVELS = [

  { id: 'beach', name: 'Teen at the Beach', feeds: 10, time: 75, scale: 1.55, scene: 'beach', hungry: 1.15 },
  { id: 'kaiju', name: 'Kaiju Kid in the Toy City', feeds: 12, time: 80, scale: 2.15, scene: 'city', hungry: 1.35 }
];
const THEMES = [
  { id: 'lawn', name: 'Sunny Lawn', sky0: '#8ec8ff', sky1: '#d7eefe', ground: '#7ec86a', ground2: '#5aa83b' },
  { id: 'dusk', name: 'Golden Dusk', sky0: '#f6b06a', sky1: '#ffe4b0', ground: '#8bb85a', ground2: '#5e8a32' }
];
const FOODS = {
  sausage:        { name: 'Sausage',        ok: true,  cols: ['#c45c48', '#8a3a30'] },
  'fairy-bread':  { name: 'Fairy bread',    ok: true,  cols: ['#fff4d6', '#ff6b9a'] },
  mango:          { name: 'Mango',          ok: true,  cols: ['#ffb347', '#ff8a1a'] },
  lamington:      { name: 'Lamington',      ok: true,  cols: ['#5a3214', '#fff'] },
  'vegemite-toast':{ name: 'Vegemite toast',ok: true,  cols: ['#e0a04a', '#2b1a0e'] },
  'pine-cone':    { name: 'Pine cone',      ok: false, cols: ['#8a5a2a', '#6b3a1f'] },
  thong:          { name: 'Thong',          ok: false, cols: ['#ff4d6d', '#fff'] },
  soap:           { name: 'Soap',           ok: false, cols: ['#cfefff', '#7eb7d8'] },
  bucket:         { name: 'Bucket',         ok: false, cols: ['#ff9f1c', '#fff'] },
  'toy-car':      { name: 'Toy car',        ok: false, cols: ['#2c5aa0', '#ffc928'] }
};
const hook = name => { try { window.kzHooks && window.kzHooks[name] && window.kzHooks[name](); } catch (e) {} };
const store = {
  get(k, d) { try { const v = localStorage.getItem('dinoFeedMe.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('dinoFeedMe.' + k, JSON.stringify(v)); } catch (e) {} }
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const theme = () => THEMES[G.themeIx % THEMES.length];
const foodById = id => FOODS[id];
const favList = () => DINO.favourites.slice();
const wrongList = () => Object.keys(FOODS).filter(id => !FOODS[id].ok);

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const G = {
  phase: 'title', t: 0, W: 1280, H: 720, L: {},
  score: 0, best: store.get('best', 0), time: 0, level: 0,
  sound: store.get('sound', true) !== false, littleKids: false, themeIx: store.get('themeIx', 0),
  paused: false, test: false,
  dino: { x: 0, y: 0, scale: 1, mouthOpen: 0, chew: 0, spit: 0, bounce: 0, face: -1 },
  tray: [], flying: [], want: null, wantT: 0,
  feeds: 0, need: 0, combo: 0, lastFeed: -99, spat: 0, burps: 0,
  drag: null, hint: '', hintT: 0, levelFlash: 0, endWhy: '', grow: 0
};
if (window.kzPause) kzPause.onChange(p => { G.paused = p; hook(p ? 'gameplayStop' : 'gameplayStart'); });

function resize() {
  const cw = innerWidth, ch = innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = cw * dpr; cv.height = ch * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (cw >= ch) { G.H = 540; G.W = Math.round(540 * cw / ch); } else { G.W = 540; G.H = Math.round(540 * ch / cw); }
  G.L.port = G.H > G.W;
  G.L.hudY = G.L.port ? Math.max(118, 66 * G.H / innerHeight + 34) : 34;
  G.L.trayY = G.H - (G.L.port ? 110 : 86);
  layoutDino();
}
function layoutDino() {
  const L = LEVELS[G.level] || LEVELS[0];
  const port = G.L.port;
  const sc = (L.scale || 1) * (port ? 0.88 : 1) * (1 + (G.grow || 0) * 0.04);
  G.dino.scale = sc;
  const face = G.dino.face || -1;
  let x = G.W * (port ? 0.55 : 0.62);
  const snoutX = x - face * 126 * sc;
  const margin = port ? 70 : 90;
  if (face < 0 && snoutX > G.W - margin) x -= snoutX - (G.W - margin);
  if (face > 0 && snoutX < margin) x += margin - snoutX;
  G.dino.x = x;
  G.dino.y = G.H * 0.68 - 56 * sc;
}
function mouthBox() {
  const d = G.dino, sc = d.scale, extra = G.littleKids ? 1.35 : 1;
  const r = CONFIG.mouthBase * sc * extra;
  // Local art faces left (snout at x ≈ -126); d.face flips it into world space.
  return { x: d.x - d.face * 126 * sc, y: d.y - 14 * sc, r };
}

const Juice = (() => {
  let trauma = 0, stopT = 0; const parts = [], pops = [], POOL = 400;
  const noise = (t, s) => Math.sin(t * 1.7 + s) * 0.5 + Math.sin(t * 3.1 + s * 2.3) * 0.3 + Math.sin(t * 5.3 + s * 4.1) * 0.2;
  for (let i = 0; i < POOL; i++) parts.push({ on: false });
  return {
    update(dt) { trauma = Math.max(0, trauma - dt * 1.1); stopT = Math.max(0, stopT - dt);
      for (const p of parts) if (p.on) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= Math.pow(p.drag, dt); p.rot += p.vr * dt; p.life -= dt; if (p.life <= 0) p.on = false; }
      for (const p of pops) { p.t += dt; p.y -= 34 * dt; } for (let i = pops.length - 1; i >= 0; i--) if (pops[i].t > pops[i].dur) pops.splice(i, 1); },
    frozen: () => stopT > 0,
    trauma: v => { trauma = Math.min(1, trauma + v); },
    hitStop(sec) { stopT = Math.max(stopT, Math.min(0.12, sec)); },
    applyShake(ctx) { if (trauma <= 0) return; const k = trauma * trauma, t = G.t * 28; ctx.translate(14 * k * noise(t, 1), 10 * k * noise(t, 7)); ctx.rotate(0.02 * k * noise(t, 13)); },
    burst(x, y, n, cols, o = {}) {
      for (let i = 0; i < n; i++) { const p = parts.find(q => !q.on); if (!p) return;
        const a = Math.random() * 6.283, s = (o.speed || 260) * (0.35 + Math.random() * 0.8);
        Object.assign(p, { on: true, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (o.up || 120), g: o.g ?? 900, drag: o.drag ?? 0.5, life: (o.life || 0.7) * (0.6 + Math.random() * 0.6), max: o.life || 0.7,
          col: cols[i % cols.length], r: (o.size || 5) * (0.6 + Math.random() * 0.8), shape: o.shape || 'dot', rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14 }); } },
    pop(x, y, text, col, size, dur) { pops.push({ x, y, text, col, size, dur: dur || 0.8, t: 0 }); },
    clear() { for (const p of parts) p.on = false; pops.length = 0; trauma = 0; stopT = 0; },
    draw(ctx) {
      for (const p of parts) if (p.on) {
        const a = Math.max(0, p.life / p.max); ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = a; ctx.fillStyle = p.col;
        if (p.shape === 'star') { ctx.beginPath(); for (let i = 0; i < 5; i++) { const ang = i * 6.283 / 5 - Math.PI / 2, r = i % 2 ? p.r * 0.45 : p.r; ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r); } ctx.closePath(); ctx.fill(); }
        else if (p.shape === 'confetti') { ctx.fillRect(-p.r * 0.6, -p.r, p.r * 1.2, p.r * 2); }
        else { ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 7); ctx.fill(); }
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      for (const p of pops) {
        const k = Math.min(1, p.t / 0.1) * Math.max(0, 1 - (p.t - (p.dur - 0.18)) / 0.18);
        ctx.save(); ctx.globalAlpha = Math.max(0, k); ctx.translate(p.x, p.y); ctx.scale(0.7 + 0.4 * Math.min(1, p.t / 0.12), 0.7 + 0.4 * Math.min(1, p.t / 0.12));
        txt(p.text, 0, 0, p.size, p.col); ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
  };
})();

let AC = null, NB = null;
function audioInit() {
  if (!G.sound) return;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); const n = AC.sampleRate; NB = AC.createBuffer(1, n, n); const d = NB.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; } catch (e) { return; } }
  if (AC.state === 'suspended') AC.resume();
}
const pv = () => 0.92 + Math.random() * 0.16;
function tone(type, f0, f1, dur, vol = 0.15, delay = 0) {
  if (!G.sound || !AC) return; const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function hiss(dur, vol, type, f0, f1, delay = 0, q = 1) {
  if (!G.sound || !AC || !NB) return; const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; f.type = type; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur); f.Q.value = q;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + 0.02);
}
function sfx(k) {
  const p = pv();
  const S = {
    munch: () => { tone('square', 140 * p, 90 * p, 0.09, 0.08); tone('sine', 220 * p, 140 * p, 0.12, 0.07, 0.06); hiss(0.1, 0.04, 'lowpass', 800, 300, 0.02); },
    burp: () => { tone('sine', 180 * p, 90 * p, 0.22, 0.1); tone('triangle', 140 * p, 70 * p, 0.18, 0.06, 0.08); },
    spit: () => { hiss(0.12, 0.08, 'bandpass', 1400, 600, 0, 2); tone('square', 420 * p, 180 * p, 0.1, 0.05); },
    got: () => { [659, 784, 988].forEach((f, i) => tone('triangle', f * p, f * p, 0.12, 0.07, i * 0.05)); },
    start: () => { tone('square', 480, 480, 0.07, 0.05); [784, 1047].forEach((f, i) => tone('sine', f, f, 0.15, 0.08, 0.16 + i * 0.1)); },
    chime: () => [1047, 1319, 1568].forEach((f, i) => tone('sine', f, f, 0.18, 0.07, i * 0.07)),
    fanfare: () => [784, 988, 1175, 1568].forEach((f, i) => tone('triangle', f, f, i === 3 ? 0.5 : 0.15, 0.09, i * 0.12)),
    timesup: () => [[392, 330], [330, 262]].forEach(([a, b], i) => tone('sawtooth', a, b, i ? 0.4 : 0.2, 0.08, i * 0.22)),
    whoosh: () => hiss(0.16, 0.05, 'lowpass', 1200, 400, 0, 0.8)

  if (S[k]) S[k]();
}
