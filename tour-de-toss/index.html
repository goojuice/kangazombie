  .card{background:linear-gradient(#ffffff,#fff4d6);border:5px solid var(--ol);border-radius:30px;box-shadow:0 8px 0 var(--ol);
    padding:18px 26px;max-width:min(560px,92vw);max-height:90vh;overflow:auto;color:var(--ol);text-align:center}

    display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;text-shadow:0 2px 0 var(--ol);margin:0 auto}
  .medal.bronze{background:radial-gradient(circle at 35% 30%,#ffd0a0,#cd7f32 60%,#8a4a14)}
  .medal.silver{background:radial-gradient(circle at 35% 30%,#ffffff,#c0c8d4 60%,#7d8796)}
  .medal.gold{background:radial-gradient(circle at 35% 30%,#fff7b0,#ffc928 60%,#c78a00)}
  .medal.none{background:#cfd6df}
  #title{flex-direction:column;justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom) + 4vh);box-sizing:border-box;pointer-events:none}
  #title > *{pointer-events:auto}
  #title .daily{font-size:17px;color:#fff;text-shadow:0 2px 0 var(--ol);margin-top:12px;text-align:center;padding:0 12px}
</style>

<script>(function(){var fns=[],ov=document.getElementById('kzPauseOv'),P=window.kzPause={paused:false,onChange:function(f){fns.push(f)},
pause:function(){if(P.paused)return;P.paused=true;ov.classList.add('on');fns.forEach(function(f){f(true)})},
resume:function(){if(!P.paused)return;P.paused=false;ov.classList.remove('on');fns.forEach(function(f){f(false)})}};
function stop(e){e.stopPropagation()}['pointerdown','touchstart','mousedown'].forEach(function(t){document.getElementById('kzPause').addEventListener(t,stop);ov.addEventListener(t,stop)});
document.getElementById('kzPause').onclick=function(){P.paused?P.resume():P.pause()};document.getElementById('kzResume').onclick=function(){P.resume()};
document.addEventListener('visibilitychange',function(){if(document.hidden)P.pause()});addEventListener('pagehide',function(){P.pause()});
addEventListener('keydown',function(e){if(e.code==='Escape'&&P.paused){e.stopImmediatePropagation();P.resume()}},true);})();</script>

<script>
'use strict';
/* =========================== Tour de Toss =========================== *
 * Riders zoom past. Lob tomatoes, tin cans and potatoes to bump them into
 * the hay bales. Nobody gets hurt: they land in the hay and pedal off grumpy.
 * One action: tap / click / Space to throw at the aim point.           */

/* ----------------------------- config + themes ----------------------------- */
const CONFIG = {
  roundTime: 60,
  cooldown: 0.2,
  items: {   // T = flight time (s), apex = arc height, r = hit radius, pts = base points
    tomato: { name: 'Tomato', T: 0.42, apex: 70,  r: 30, pts: 10, col: '#ff3b30' },
    can:    { name: 'Tin can', T: 0.50, apex: 95,  r: 26, pts: 15, col: '#c9d2dc' },
    potato: { name: 'Potato', T: 0.64, apex: 150, r: 40, pts: 20, col: '#c08a4b' }
  },
  yellowPts: 50,
  comboWindow: 2.2,
  medals: [ { id: 'bronze', name: 'Bronze', at: 300 }, { id: 'silver', name: 'Silver', at: 1000 }, { id: 'gold', name: 'Gold', at: 2200 } ]   // from the tests.js bot sim
};
const THEMES = [
  { id: 'country', name: 'Countryside', sky: ['#5ec8ff', '#c9f0ff'], hill: '#6fcf4f', hill2: '#4fb83a', road: '#5d6470', verge: '#8be05a',
    jerseys: ['#ff4d6d', '#3ec5ff', '#7be36b', '#ff9f1c', '#b07cff', '#ffffff'], skin: '#ffcf9e', rider: 'human' },
  { id: 'outback', name: 'Outback', sky: ['#ff9f5a', '#ffe0a6'], hill: '#d96a2b', hill2: '#b8501c', road: '#6b5a50', verge: '#e8a23c',
    jerseys: ['#2f8fe0', '#7be36b', '#ff4d6d', '#ffffff', '#b07cff', '#1fb5a8'], skin: '#b07a4a', rider: 'roo' }
];

/* ad / portal seams (playbook #34): a portal SDK can hook these later. Nothing is sent anywhere. */
const hook = name => { try { window.kzHooks && window.kzHooks[name] && window.kzHooks[name](); } catch (e) {} };

/* ----------------------------- storage ----------------------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('tourDeToss.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('tourDeToss.' + k, JSON.stringify(v)); } catch (e) {} }
};
const littleKidsGet = () => { try { return localStorage.getItem('kzArcade.littleKids') === '1'; } catch (e) { return false; } };
const littleKidsSet = v => { try { localStorage.setItem('kzArcade.littleKids', v ? '1' : '0'); } catch (e) {} };

/* ----------------------------- state ----------------------------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const G = {
  phase: 'title', paused: false, sound: store.get('sound', true), themeIx: store.get('theme', 0) % THEMES.length,
  littleKids: littleKidsGet(), best: store.get('best', 0),
  W: 960, H: 540, L: {}, t: 0, time: 0, score: 0, combo: 0, lastHit: -9, bestCombo: 0, tumbles: 0, throws: 0, hits: 0, yellows: 0, potatoTumbles: 0,
  riders: [], shots: [], debris: [], decals: [], bales: [], queue: [], aim: { x: 480, y: 380, show: false }, cool: 0, spawnT: 0, yellowT: 8, throwAnim: 0
};
const theme = () => THEMES[G.themeIx];
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

/* ----------------------------- layout ----------------------------- */
let DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const cw = innerWidth, ch = innerHeight;
  cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
  if (cw >= ch) { G.H = 540; G.W = Math.round(540 * cw / ch); } else { G.W = 540; G.H = Math.round(540 * ch / cw); }
  const W = G.W, H = G.H, port = H > W, L = G.L;
  L.port = port;
  L.horizon = H * (port ? 0.32 : 0.34);
  L.roadTop = H * (port ? 0.43 : 0.50);
  L.roadBot = H * (port ? 0.66 : 0.79);
  L.playerX = W / 2; L.playerY = H * (port ? 0.82 : 0.97);
  L.hudY = port ? Math.max(118, 66 * H / innerHeight + 34) : 34;
  L.lanes = [0.2, 0.5, 0.8].map(f => L.roadTop + (L.roadBot - L.roadTop) * f);
  G.bales = [];
  for (let x = 60; x < W + 80; x += 170) G.bales.push({ x, gy: L.roadTop - 10, side: 0, squash: 0 });
  for (let x = 140; x < W + 80; x += 210) G.bales.push({ x, gy: L.roadBot + 16, side: 1, squash: 0 });
  G.aim.x = clamp(G.aim.x, 0, W); G.aim.y = L.lanes[1];
}
const depth = gy => clamp(0.62 + 0.5 * (gy - G.L.horizon) / (G.L.roadBot - G.L.horizon), 0.55, 1.25) * (G.L.port ? 1.12 : 1);

/* ----------------------------- round ----------------------------- */
function nextItem() { const k = ['tomato', 'can', 'potato']; return k[Math.floor(Math.random() * 3)]; }
function startRound() {
  Object.assign(G, { phase: 'play', time: CONFIG.roundTime, score: 0, combo: 0, lastHit: -9, bestCombo: 0, tumbles: 0, throws: 0, hits: 0, yellows: 0, potatoTumbles: 0,
    riders: [], shots: [], debris: [], decals: [], cool: 0, spawnT: 0.2, yellowT: rnd(7, 11), throwAnim: 0 });
  G.queue = ['tomato', 'can', 'potato']; Juice.clear(); G.comboPulse = 0; G.tutorial = !store.get('played', false) || G.littleKids;
  hook('gameplayStart');
  show('title', false); show('end', false);
  sfx('whistle');
}
function endRound() {
  G.phase = 'end'; store.set('played', true); hook('gameplayStop');
  const md = medalFor(G.score), newBest = G.score > G.best;
  if (newBest) { G.best = G.score; store.set('best', G.best); }
  const dl = daily(), dk = 'daily-' + todayKey(), dDone = dl.check(G);
  if (dDone) store.set(dk, true);
  const acc = G.throws ? Math.round(100 * G.hits / G.throws) : 0;
  document.getElementById('endCard').innerHTML =
    '<h2>' + (newBest ? 'New best!' : 'Stage done!') + '</h2>' +
    (md ? '<div class="medal ' + md.id + '">★</div><h3>' + md.name + ' medal</h3>' : '<div class="medal none">★</div><h3>Bronze at ' + CONFIG.medals[0].at + '</h3>') +
    '<div class="stats"><span>Score</span><b>' + G.score + '</b><span>Into the hay</span><b>' + G.tumbles + '</b><span>Best combo</span><b>x' + G.bestCombo +
    '</b><span>Aim</span><b>' + acc + '%</b><span>Best ever</span><b>' + G.best + '</b></div>' +
    '<div class="row" style="gap:18px;margin-top:4px">' + CONFIG.medals.map(m => '<div style="font-size:14px"><div class="medal ' + (G.score >= m.at ? m.id : 'none') + '" style="width:40px;height:40px;font-size:18px;border-width:3px">★</div>' + m.at + '</div>').join('') + '</div>' +
    '<h3 style="font-size:17px">' + (dDone ? '✅ Daily goal done!' : 'Daily goal: ' + dl.txt) + '</h3>' +
    '<div class="row"><button class="btn green" id="bAgain">↻ Again</button><button class="btn pill" id="bHome">🏠 Menu</button></div>';
  show('end', true);
  document.getElementById('bAgain').onclick = startRound;
  document.getElementById('bHome').onclick = () => { show('end', false); G.phase = 'title'; G.riders = []; show('title', true); syncUI(); };
  sfx('whistle');
}
const medalFor = s => { let m = null; for (const x of CONFIG.medals) if (s >= x.at) m = x; return m; };

/* daily goal: picked from the date, saved on this device only */
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const DAILIES = [
  { txt: 'Bump 15 riders into the hay', check: g => g.tumbles >= 15 },
  { txt: 'Hit 2 yellow jerseys', check: g => g.yellows >= 2 },
  { txt: 'Get a x5 combo', check: g => g.bestCombo >= 5 },
  { txt: 'Bump 5 riders with potatoes', check: g => g.potatoTumbles >= 5 }
];
function daily() { const k = todayKey(); let h = 0; for (const c of k) h = (h * 31 + c.charCodeAt(0)) | 0; return DAILIES[Math.abs(h) % DAILIES.length]; }

/* ----------------------------- riders ----------------------------- */
function spawnRider(yellow) {
  const L = G.L, lane = Math.floor(Math.random() * 3), gy = L.lanes[lane];
  for (const r of G.riders) if (r.lane === lane && r.state === 'ride' && r.x > G.W - 40) return false;  // no pile-ups at the start line
  const ramp = 1 + 0.45 * (1 - G.time / CONFIG.roundTime), kid = G.littleKids ? 0.7 : 1;
  const cross = rnd(3.4, 5.6) / ramp / (yellow ? 1.35 : 1);
  const th = theme();
  G.riders.push({ x: G.W + 60, gy, lane, z: 0, vx: -(G.W + 120) / cross * kid, state: 'ride', st: 0, crank: Math.random() * 6,
    jersey: yellow ? '#ffe11a' : th.jerseys[Math.floor(Math.random() * th.jerseys.length)], yellow: !!yellow,
    rot: 0, bike: null, bale: null, grumpy: false, wob: 0 });
  return true;
}
function updateRiders(dt) {
  const L = G.L;
  if (G.phase === 'play') {
    G.spawnT -= dt; G.yellowT -= dt;
    if (G.yellowT <= 0) { if (spawnRider(true)) G.yellowT = rnd(8, 12); }
    if (G.spawnT <= 0) {
      const pack = Math.random() < 0.35 ? 3 : 1;  // sometimes a little peloton
      let n = 0; for (let i = 0; i < pack; i++) if (spawnRider(false)) n++;
      const ramp = 1 + 0.6 * (1 - G.time / CONFIG.roundTime);
      G.spawnT = (n > 1 ? 1.6 : rnd(0.6, 1.3)) / ramp * (G.littleKids ? 1.2 : 1);
    }
  } else if (G.phase === 'title') {
    G.spawnT -= dt; if (G.spawnT <= 0) { spawnRider(Math.random() < 0.15); G.spawnT = rnd(0.7, 1.4); }
  }
  for (const r of G.riders) {
    r.st += dt; r.squash = Math.max(0, (r.squash || 0) - dt * 5);
    if (r.state === 'ride' || r.state === 'wobble' || r.state === 'off') {
      let vx = r.vx;
      if (r.state === 'ride') for (const o of G.riders) if (o !== r && o.lane === r.lane && o.state === 'ride' && o.x < r.x && r.x - o.x < 80) vx = Math.max(vx, o.vx);
      if (r.state === 'wobble') vx *= 0.6;
      if (r.state === 'off') vx = r.vx * 0.45;
      r.x += vx * dt; r.crank += -vx * dt * 0.05;
      if (r.state === 'wobble' && r.st > 0.3) startTumble(r);
      if (r.yellow && r.state === 'ride' && Math.random() < dt * 8) Juice.burst(r.x + rnd(-20, 20), r.gy - rnd(20, 80) * depth(r.gy), 1, ['#fff7b0', '#ffe11a'], { shape: 'star', speed: 30, up: 20, g: -20, size: 3, life: 0.6 });
    } else if (r.state === 'tumble') {
      const u = clamp(r.st / 0.7, 0, 1);
      r.x = lerp(r.fx, r.bale.x, u); r.gy = lerp(r.fgy, r.bale.gy, u); r.z = 130 * 4 * u * (1 - u); r.rot = -u * Math.PI * 3;
      if (u >= 1) { r.state = 'hay'; r.st = 0; r.bale.squash = 1; sfx('boing'); const sc = depth(r.bale.gy);
        Juice.burst(r.bale.x, r.bale.gy - 40 * sc, 22, ['#ffe27a', '#f6c945', '#d9a72a'], { shape: 'straw', speed: 260, up: 200, size: 7, life: 0.9 }); Juice.trauma(0.12);
        Juice.pop(r.bale.x, r.bale.gy - 80 * sc, 'BOING!', '#ffe27a', 22, 0.7); }
    } else if (r.state === 'hay') {
      if (r.st > 1.0) { r.state = 'grumpy'; r.st = 0; r.rot = 0; r.z = 0; r.gy = r.lane === 0 ? L.roadTop + 6 : r.lane === 2 ? L.roadBot - 6 : r.gy; r.grumpy = true; sfx('hmph'); sfx('poof');
        const sc = depth(r.gy); Juice.burst(r.x, r.gy - 20 * sc, 12, ['#ffffff', '#e6e6ee'], { speed: 120, up: 60, g: -60, size: 9, life: 0.6 }); Juice.pop(r.x, r.gy - 120 * sc, 'Hmph!', '#fff', 22, 1.0); }
    } else if (r.state === 'grumpy') {
      if (r.st > 0.6) { r.state = 'off'; r.st = 0; }
    }
    if (r.bike) { const b = r.bike; b.x += b.vx * dt; b.vx *= Math.pow(0.05, dt); b.rot = lerp(b.rot, b.toRot, 1 - Math.exp(-10 * dt)); }
  }
  G.riders = G.riders.filter(r => r.x > -120);
}
function startTumble(r) {
  // pick the nearest hay bale on the rider's side of the road, a bit ahead of them
  const side = r.lane === 0 ? 0 : r.lane === 2 ? 1 : (Math.random() < 0.5 ? 0 : 1);
  let best = null, bd = 1e9;
  for (const b of G.bales) if (b.side === side) { const d = Math.abs(b.x - (r.x - 90)); if (d < bd) { bd = d; best = b; } }
  r.state = 'tumble'; r.st = 0; r.fx = r.x; r.fgy = r.gy; r.bale = best;
  r.bike = { x: r.x, gy: r.gy, vx: r.vx * 0.5, rot: 0, toRot: Math.PI };
}

/* ----------------------------- throwing ----------------------------- */
function throwAt(sx, sy) {
  if (G.phase !== 'play' || G.paused || G.cool > 0) return;
  const L = G.L;
  let ty = clamp(sy, L.horizon + 20, L.playerY - 40);
  if (ty > L.roadTop - 30 && ty < L.roadBot + 30) {   // snap to the nearest lane: the skill is in the timing

/* ----------------------------- input ----------------------------- */
function toWorld(e) { const rc = cv.getBoundingClientRect(); return { x: (e.clientX - rc.left) / rc.width * G.W, y: (e.clientY - rc.top) / rc.height * G.H }; }
cv.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); const p = toWorld(e); G.aim.x = p.x; G.aim.y = p.y; if (G.phase === 'play') throwAt(p.x, p.y); });
cv.addEventListener('pointermove', e => { const p = toWorld(e); G.aim.x = p.x; G.aim.y = p.y; G.aim.show = e.pointerType === 'mouse'; });
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true; audioInit();
  if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { e.preventDefault(); if (G.phase === 'play') throwAt(G.aim.x, G.aim.y); else if (G.phase === 'title') startRound(); }
  if (e.code === 'KeyM') toggleSound();
  if (e.code === 'KeyP' && window.kzPause && G.phase === 'play') kzPause.paused ? kzPause.resume() : kzPause.pause();
});
addEventListener('keyup', e => keys[e.code] = false);
function keyAim(dt) {
  const v = 600 * dt; let m = false;
  if (keys.ArrowLeft || keys.KeyA) { G.aim.x -= v; m = true; } if (keys.ArrowRight || keys.KeyD) { G.aim.x += v; m = true; }
  if (keys.ArrowUp || keys.KeyW) { G.aim.y -= v; m = true; } if (keys.ArrowDown || keys.KeyS) { G.aim.y += v; m = true; }
  if (m) { G.aim.show = true; G.aim.x = clamp(G.aim.x, 0, G.W); G.aim.y = clamp(G.aim.y, G.L.horizon + 20, G.L.playerY - 40); }
}

  $('dailyTxt').textContent = (store.get('daily-' + todayKey(), false) ? '✅ ' : '⭐ Today: ') + daily().txt + (G.best ? '   ·   Best: ' + G.best : '');
}
$('snd').onclick = toggleSound;
$('bPlay').onclick = () => { audioInit(); startRound(); };
$('bTheme').onclick = () => { G.themeIx = (G.themeIx + 1) % THEMES.length; store.set('theme', G.themeIx); G.riders = []; syncUI(); };
$('bKids').onclick = () => { G.littleKids = !G.littleKids; littleKidsSet(G.littleKids); syncUI(); };
['pointerdown', 'touchstart', 'mousedown'].forEach(t => { for (const id of ['snd', 'title', 'end']) $(id).addEventListener(t, e => { if (e.target !== $('title')) e.stopPropagation(); }); });

let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  if (!G.paused && !G.test) { keyAim(dt); step(dt); }
  draw(); requestAnimationFrame(frame);
}
addEventListener('resize', resize); resize(); syncUI();
if (window.kzPause) kzPause.onChange(p => { G.paused = p; if (p) hook('gameplayStop'); else if (G.phase === 'play') hook('gameplayStart'); });
window.TT = { G, step, draw, startRound, endRound, throwAt, spawnRider, resize, CONFIG, THEMES };
requestAnimationFrame(frame);
</script>
</body>
