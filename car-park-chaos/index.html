<script>(function(){var fns=[],ov=document.getElementById('kzPauseOv'),P=window.kzPause={paused:false,onChange:function(f){fns.push(f)},
pause:function(){if(P.paused)return;P.paused=true;ov.classList.add('on');fns.forEach(function(f){f(true)})},
resume:function(){if(!P.paused)return;P.paused=false;ov.classList.remove('on');fns.forEach(function(f){f(false)})}};
function stop(e){e.stopPropagation()}['pointerdown','touchstart','mousedown'].forEach(function(t){document.getElementById('kzPause').addEventListener(t,stop);ov.addEventListener(t,stop)});
document.getElementById('kzPause').onclick=function(){P.paused?P.resume():P.pause()};document.getElementById('kzResume').onclick=function(){P.resume()};
document.addEventListener('visibilitychange',function(){if(document.hidden)P.pause()});addEventListener('pagehide',function(){P.pause()});
addEventListener('keydown',function(e){if(e.code==='Escape'&&P.paused){e.stopImmediatePropagation();P.resume()}},true);})();</script>

<script>
'use strict';
/* ======================== Car Park Chaos ======================== *
 * Drive in the entry boom, park neatly in a glowing spot, then toot
 * out the exit. Funny school kids hop clear with a "Hey!" — never a
 * crash. Cute, silly school-run cartoon, nothing harsh. */

/* ----------------------------- config + themes ----------------------------- */
const TITLE = 'Car Park Chaos';   // official name — swap this one string to rename the game
document.title = TITLE;
const MAPW = 2400, MAPH = 1680;
const CONFIG = {
  parkPts: 100, exitPts: 20, nobump: 30, finishBonus: 150,
  neat: [12, 40, 80],
  kidPenalty: 25, kidTimePenalty: 3, kerbPenalty: 10,
  holdPark: 0.55, kidsHold: 0.32,
  carL: 54, carW: 28,
  karenWait: 0.7, karenCool: 10, mumFirst: 11, mumCool: 22,
  /* Medal thresholds, set by KZ Build Engineering at Damo's request
     (he delegated this on the 17 Nov 2026 call). Same in Little Kids.
     Review after a real phone/iPad playtest.
     Sanity check with the -25 points and -3 s kid-bump rule:
     a near-perfect 12-park run (mostly Spot on, clean exits, +150 finish) is about 3000–3200.
     Gold 2400 is ~75–80% of that (a clean, neat full run that can miss a few perfects).
     Silver 1300 is roughly a tidy pass through Morning Drop-off and Rainy Day (about 7–8 parks) with a few bumps.
     Bronze 500 is a tidy Morning Drop-off (3 parks and a couple of bumps). */
  medals: [ { id: 'bronze', name: 'Bronze', at: 500 }, { id: 'silver', name: 'Silver', at: 1300 }, { id: 'gold', name: 'Gold', at: 2400 } ]
};
const LEVELS = [
  { id: 'morning', name: 'Morning Drop-off', trips: 3, time: 55, kids: 7, occ: 0.42, bayScale: 1, slip: 0 },
  { id: 'rainy', name: 'Rainy Day', trips: 4, time: 50, kids: 10, occ: 0.55, bayScale: 0.94, slip: 0.16 },
  { id: 'sports', name: 'Sports Carnival', trips: 5, time: 45, kids: 12, occ: 0.62, bayScale: 0.88, slip: 0 }
];
const THEMES = [
  { id: 'sunnyvale', name: 'Sunnyvale', brick: '#c45c48', brick2: '#b04e3c', trim: '#f3d27a', roof: '#6b2b2b',
    car: '#ffd23a', car2: '#ff9f1c', sky0: '#7ec8ff', sky1: '#c7ecff', grass: '#6fc24a', grass2: '#5aa83b',
    uniform: '#2c5aa0', schoolName: 'SUNNYVALE PRIMARY' },
  { id: 'harbour', name: 'Harbour School', brick: '#6d8ba8', brick2: '#5c7a96', trim: '#f4e2c0', roof: '#3d4a5c',
    car: '#3ec6c9', car2: '#1e8f9a', sky0: '#8ed0e8', sky1: '#e8f4fa', grass: '#8bc45a', grass2: '#6fa644',
    uniform: '#0e6b5c', schoolName: 'HARBOUR SCHOOL' }
];
const CAR_COLS = [['#ff5a6a','#d43548'],['#4da3ff','#2b74d4'],['#7be36b','#3fae2a'],['#ff9f1c','#e07800'],
  ['#c9a0ff','#8a62d4'],['#fff4d6','#d0c4a0'],['#ff7ad9','#d44ca8'],['#8bd4c8','#4ea396']];

const hook = name => { try { window.kzHooks && window.kzHooks[name] && window.kzHooks[name](); } catch (e) {} };

const store = {
  get(k, d) { try { const v = localStorage.getItem('carParkChaos.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('carParkChaos.' + k, JSON.stringify(v)); } catch (e) {} }
};
const littleKidsGet = () => { try { return localStorage.getItem('kzArcade.littleKids') === '1'; } catch (e) { return false; } };
const littleKidsSet = v => { try { localStorage.setItem('kzArcade.littleKids', v ? '1' : '0'); } catch (e) {} };

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const G = {
  phase: 'title', paused: false, sound: store.get('sound', true), themeIx: store.get('theme', 0) % THEMES.length,
  littleKids: littleKidsGet(), best: store.get('best', 0),
  W: 960, H: 540, L: {}, t: 0, time: 0, score: 0,
  cam: { x: 1200, y: 500 }, map: null, car: null, kids: [],
  trip: 'enter', parkHold: 0, level: 0, trips: 0, bumps: 0, tripBumps: 0, parks: 0, perfects: 0, clean: 0, bestClean: 0, exits: 0,
  endWhy: '', tutorial: true, usePads: false, nav: null, hint: '', hintT: 0, levelFlash: 0, hornT: 0
};
const theme = () => THEMES[G.themeIx];
const level = () => LEVELS[G.level] || LEVELS[0];
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const angNorm = a => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
const angDiff = (a, b) => Math.abs(angNorm(a - b));
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

let DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const cw = innerWidth, ch = innerHeight;
  cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
  if (cw >= ch) { G.H = 540; G.W = Math.round(540 * cw / ch); } else { G.W = 540; G.H = Math.round(540 * ch / cw); }
  G.L.port = G.H > G.W;
  G.L.hudY = G.L.port ? Math.max(118, 66 * G.H / innerHeight + 34) : 34;
  G.L.showPads = G.phase === 'play' && (G.usePads || G.L.port || cw < 900);
  syncPads();
}
function updateCam(dt) {
  const c = G.car, cam = G.cam, look = G.phase === 'title' ? titleLook() : { x: c.x, y: c.y };
  const dx = look.x - cam.x, dy = look.y - cam.y;
  const zx = G.W * 0.18, zy = G.H * 0.16;
  let tx = cam.x, ty = cam.y;
  if (Math.abs(dx) > zx) tx = look.x - Math.sign(dx) * zx;
  if (Math.abs(dy) > zy) ty = look.y - Math.sign(dy) * zy;
  const k = 1 - Math.exp(-(G.phase === 'title' ? 1.4 : 4.2) * dt);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  const mx = G.W / 2, my = G.H / 2;
  cam.x = clamp(cam.x, mx, MAPW - mx); cam.y = clamp(cam.y, my, MAPH - my);
}
function titleLook() { return { x: 1200 + Math.sin(G.t * 0.18) * 360, y: 400 + Math.cos(G.t * 0.14) * 60 }; }
function viewToWorld(x, y) { return { x: x + G.cam.x - G.W / 2, y: y + G.cam.y - G.H / 2 }; }
function worldToView(x, y) { return { x: x - G.cam.x + G.W / 2, y: y - G.cam.y + G.H / 2 }; }

/* Map layout from school car-park research: one-way loop, separate entry
 * and exit booms, left-side kiss-and-drop with zebras at both ends, 60-degree
 * short-stay bays, a saw-tooth bus bay off the parent loop, and footpaths
 * all around. The lot is bigger than the screen, so the camera follows. */
function buildMap(occ) {
  const M = { solids: [], bays: [], kiss: [], zebras: [], arrows: [], marks: [], trees: [], bushes: [],
    puddles: [], cones: [], signs: [], benches: [], bitumen: [], paths: [], islands: [] };
  const solid = (x, y, w, h, kind) => M.solids.push({ x, y, w, h, kind: kind || 'kerb' });
  const rect = (arr, x, y, w, h) => arr.push({ x, y, w, h });
  rect(M.bitumen, 0, 1500, 2400, 180);
  rect(M.bitumen, 270, 1420, 160, 100);
  rect(M.bitumen, 1970, 1420, 160, 100);
  rect(M.bitumen, 240, 350, 220, 1170);
  rect(M.bitumen, 1940, 350, 220, 1170);
  rect(M.bitumen, 240, 350, 1920, 210);
  rect(M.bitumen, 460, 560, 1480, 860);
  rect(M.paths, 180, 270, 2040, 80);
  rect(M.paths, 40, 350, 200, 1070);
  rect(M.paths, 2160, 350, 200, 1070);
  rect(M.paths, 460, 1420, 1510, 80);
  M.school = { x: 200, y: 20, w: 2000, h: 250 };
  solid(200, 20, 2000, 250, 'building');
  solid(-40, -40, MAPW + 80, 60, 'fence');
  solid(-40, -40, 60, MAPH + 80, 'fence');
  solid(MAPW - 20, -40, 60, MAPH + 80, 'fence');
  solid(-40, MAPH - 16, 310, 60, 'fence');
  solid(430, MAPH - 16, 1540, 60, 'fence');
  solid(2130, MAPH - 16, 360, 60, 'fence');
  const island = (x, y, w, h) => { rect(M.islands, x, y, w, h); solid(x, y, w, h, 'kerb'); };
  island(40, 1420, 230, 80);
  island(2130, 1420, 230, 80);
  island(700, 1240, 220, 90);
  island(1480, 1240, 220, 90);
  island(1080, 300, 160, 40);
  M.entry = { x: 350, y: 1488, w: 140, h: 70, a: -Math.PI / 2, posts: [{ x: 270, y: 1488 }, { x: 430, y: 1488 }] };
  M.exit = { x: 2050, y: 1488, w: 140, h: 70, a: Math.PI / 2, posts: [{ x: 1970, y: 1488 }, { x: 2130, y: 1488 }] };
  M.entry.posts.forEach(p => solid(p.x - 10, p.y - 10, 20, 20, 'post'));
  M.exit.posts.forEach(p => solid(p.x - 10, p.y - 10, 20, 20, 'post'));
  M.spawn = { x: 350, y: 1598, a: -Math.PI / 2 };
  M.zebras.push({ x: 500, y: 350, w: 56, h: 210 }, { x: 1844, y: 350, w: 56, h: 210 }, { x: 1080, y: 1420, w: 200, h: 50 });
  const arrow = (x, y, a) => M.arrows.push({ x, y, a });
  arrow(350, 1380, -Math.PI / 2); arrow(350, 1100, -Math.PI / 2); arrow(350, 780, -Math.PI / 2);
  arrow(620, 455, 0); arrow(1000, 455, 0); arrow(1400, 455, 0); arrow(1700, 455, 0);
  arrow(2050, 780, Math.PI / 2); arrow(2050, 1100, Math.PI / 2); arrow(2050, 1380, Math.PI / 2);
  arrow(700, 930, 0); arrow(1400, 930, 0); arrow(500, 930, 0); arrow(1880, 930, 0); arrow(350, 930, 0);
  M.marks.push({ t: 'KISS & DROP', x: 1180, y: 500, a: 0, s: 28 }, { t: '10', x: 350, y: 1240, a: -Math.PI / 2, s: 36 },
    { t: 'ENTRY', x: 350, y: 1544, a: 0, s: 22 }, { t: 'EXIT', x: 2050, y: 1544, a: 0, s: 22 },
    { t: 'ONE WAY', x: 350, y: 640, a: -Math.PI / 2, s: 20 }, { t: 'BUS ONLY', x: 140, y: 880, a: -Math.PI / 2, s: 18 },
    { t: 'STAFF', x: 820, y: 1368, a: 0, s: 22 }, { t: 'SLOW', x: 2050, y: 1240, a: Math.PI / 2, s: 22 });
  for (let i = 0; i < 14; i++) {
    const x = 560 + i * 88, y = 382, occupied = Math.random() < 0.45;
