<script>
// ENGINE defaults. Each theme can override any of these in theme.config.
window.KZ = window.KZ || {};
KZ.CONFIG = {
  lives: 3,
  invincibleTime: 1.5,       // seconds of flashing after a hit
  shakeTime: 0.4,
  zombiePoints: 10,
  comboStep: 3,              // every 3 zombies in a row adds +1x multiplier
  comboMax: 5,
  comboTimeout: 4,           // seconds without a zombie resets combo
  warmupTime: 6,             // seconds of easy, zombie-only spawns at start
  startSpeed: 38,            // world units / second
  maxSpeed: 95,
  speedRamp: 0.9,            // units/s gained per second
  rowGapStart: 34,           // world distance between spawn rows
  rowGapMin: 16,
  drawDistance: 140,
  lanes: [-0.62, 0, 0.62],   // lane centres, road edge = ±1
  steerSpeed: 2.6,           // player x units / second at full steer
  hitDepth: 3,
  hitWidth: 0.36,
  zombieChance: 0.45,
  distancePointsPerUnit: 0.02
};
Object.assign(KZ.CONFIG, {
  restartDelay: 0.35,        // seconds before a tap restarts after game over (near-instant, Flappy Bird style)
  nearMissWidth: 0.6,        // pass a normal animal closer than this (but not a hit) = near miss
  nearMissPoints: 5,
  slowmoTime: 0.6, slowmoScale: 0.35  // slow-mo when the combo multiplier hits x3+
});
// Variable rewards
Object.assign(KZ.CONFIG, {
  goldenChance: 0.05, goldenPoints: 100,
  pickupChance: 0.12,              // per spawn row, after warm-up
  nitroTime: 3, magnetTime: 8, nitroBoost: 1.45,
  xpPerScore: 0.25, xpPerZombie: 2, xpPerDaily: 50,
  difficultyTime: 90
});

</script>
<script>
// Theme registry. Everything game-specific lives in themes/<id>/ and registers here.
// The engine only ever reads KZ.T (the active theme) after KZ.selectTheme().
(function () {
  const themes = KZ.THEMES = {};
  // A theme can be split across several files; each file calls KZ.defineTheme(id) and adds to it.
  KZ.defineTheme = function (id) { return themes[id] || (themes[id] = { id }); };
  KZ.selectTheme = function () {
    let id = KZ.THEME_ID;                                      // set by a single-file build
    try { id = new URLSearchParams(location.search).get('theme') || id; } catch (e) {}
    if (!themes[id]) id = Object.keys(themes)[0];
    const T = KZ.T = themes[id];
    Object.assign(KZ.CONFIG, T.config || {});
    KZ.SPRITES = T.sprites || {};
    KZ.MISSIONS = T.goals || [];
    KZ.CARS = T.skins || [{ id: 'default', name: 'Default', paint: '#c4161c', unlock: 1 }];
    KZ.ANIMAL_TYPES = Object.keys(T.creatures || {});
    document.title = T.name || 'Game';
    return T;
  };
  // UI text: KZ.s('oops', { name: 'emu' }) -> "OOPS! Missed the emu". Missing keys show the key.
  KZ.s = function (key, vars) {
    let t = (KZ.T.strings && KZ.T.strings[key]);
    if (t === undefined) t = KZ.DEFAULT_STRINGS[key];
    if (t === undefined) t = key;
    if (typeof t === 'object') t = ('ontouchstart' in window) ? t.touch : t.desktop;
    return String(t).replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] !== undefined ? vars[k] : m));
  };
  // Engine defaults for menu words; a theme can override any of them in T.strings.
  KZ.DEFAULT_STRINGS = {
    resumeBtn: 'RESUME', restartBtn: 'RESTART', quitBtn: 'QUIT TO TITLE', exitBtn: 'EXIT', titleBtn: 'TITLE',
    pauseKeys: { touch: '', desktop: 'Esc / P resume  ·  R restart  ·  Q quit' },
    bye: 'Thanks for playing!', byeHint: { touch: 'You can close this tab · tap to play again', desktop: 'You can close this tab · press any key to play again' }
  };
  // Current level (stage) definition, merged with the theme defaults.
  KZ.level = function (i) { const L = KZ.T.levels || [{ name: '', distance: 0 }]; return L[Math.max(0, Math.min(L.length - 1, i))]; };
  KZ.scenery = function (g) { const lv = KZ.level(g ? g.levelIdx || 0 : 0); return Object.assign({}, KZ.T.scenery, lv.scenery || {}); };
})();

</script>
<script>
// Sprite system: loads KZ.SPRITES, plays animations, tints zombie/golden variants, falls back safely.
(function () {
  const S = KZ.Sprites = { img: {}, status: {}, tintCache: {} };
  function frameRects(key, e, im) {
    if (e.atlas && e.atlas.frames) {               // Aseprite (hash or array) / TexturePacker JSON
      const fr = Array.isArray(e.atlas.frames) ? e.atlas.frames : Object.values(e.atlas.frames);
      return fr.map(f => f.frame);
    }
    const cols = e.cols || Math.max(1, Math.floor(im.width / e.frameW)), rows = Math.max(1, Math.floor(im.height / e.frameH)), out = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) out.push({ x: c * e.frameW, y: r * e.frameH, w: e.frameW, h: e.frameH });
    return out;
  }
  // Path -> URL. dist build inlines images as data URIs in KZ.SPRITE_DATA; tests set KZ.BASE.
  // In a single-file build (KZ.INLINE_ONLY) anything not packed in is treated as missing: no network request.
  const url = KZ.assetUrl = p => (KZ.SPRITE_DATA && KZ.SPRITE_DATA[p]) || (KZ.INLINE_ONLY ? '' : (KZ.BASE || '') + p);   // also used for sounds
  S.load = function () {
    for (const [key, e] of Object.entries(KZ.SPRITES || {})) {
      if (e.enabled === false || e.tint) continue;
      if (e.frames && e.count) {                     // individual numbered frames
        const imgs = []; let left = e.count; S.status[key] = 'loading';
        for (let i = 0; i < e.count; i++) { const im = new Image(); im.onload = () => { if (--left === 0) { S.img[key] = { list: imgs }; S.status[key] = 'ok'; } }; im.onerror = () => S.status[key] = 'failed'; im.src = url(e.frames.replace('{i}', i)); imgs.push(im); }
      } else if (e.image) {
        const im = new Image(); S.status[key] = 'loading';
        im.onload = () => { S.img[key] = { sheet: im, rects: frameRects(key, e, im) }; S.status[key] = 'ok'; };
        im.onerror = () => { S.status[key] = 'failed'; console.info('[sprites] ' + key + ': image missing, using placeholder'); };
        const u = url(e.image); if (!u) { S.status[key] = 'failed'; continue; } im.src = u;
      }
    }
  };
  // Returns the [source, x, y, w, h] for an animation frame, or null.
  function frame(key, anim, t) {
    const e = KZ.SPRITES[key], L = S.img[key]; if (!e || !L) return null;
    const a = (e.anims && (e.anims[anim] || e.anims.run || e.anims.idle)) || { from: 0, to: 0 };
    const n = a.to - a.from + 1, f = Math.floor(t * (a.fps || 10));
    const idx = a.from + (a.loop === false ? Math.min(n - 1, f) : f % n);
    if (L.list) { const im = L.list[idx]; return im ? [im, 0, 0, im.width, im.height] : null; }
    const r = L.rects[idx]; return r ? [L.sheet, r.x, r.y, r.w, r.h] : null;
  }
  function tinted(src, x, y, w, h, mode) {            // cached tinted copy of a frame
    const k = mode + '|' + (src.src || '').slice(-60) + '|' + x + ',' + y;
    if (S.tintCache[k]) return S.tintCache[k];
    const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
    g.drawImage(src, x, y, w, h, 0, 0, w, h);
    g.globalCompositeOperation = 'source-atop'; g.fillStyle = mode === 'gold' ? 'rgba(255,200,30,0.6)' : 'rgba(70,200,40,0.55)'; g.fillRect(0, 0, w, h);
    return (S.tintCache[k] = c);
  }
  // Draw `type` (e.g. 'kangaroo') at the current origin (foot point). variant: '' | 'zombie' | 'golden'.
  // size = height in px of the placeholder. Returns false if no sprite is available (caller draws placeholder).
  S.draw = function (ctx, type, variant, anim, t, size) {
    let key = variant ? (variant === 'golden' ? 'golden_zombie' : type + '_zombie') : type, tint = null;
    const ve = KZ.SPRITES[key];
    if (variant && (!ve || ve.tint || S.status[key] !== 'ok')) { tint = variant === 'golden' ? 'gold' : 'green'; key = type; }
    if (S.status[key] !== 'ok') return false;
    const e = KZ.SPRITES[key], fr = frame(key, anim, t); if (!fr) return false;
    let [src, x, y, w, h] = fr;
    if (tint) { src = tinted(src, x, y, w, h, tint); x = 0; y = 0; }
    const dh = size * (e.scale || 1), dw = dh * w / h, ax = (e.anchor || [0.5, 1])[0], ay = (e.anchor || [0.5, 1])[1];
    ctx.drawImage(src, x, y, w, h, -dw * ax, -dh * ay, dw, dh);
    if (tint === 'green') {                            // glowing eyes overlay (approximate head position)
      ctx.save(); ctx.shadowColor = '#b6ff3b'; ctx.shadowBlur = dh * 0.05; ctx.fillStyle = '#d8ff3b';
      for (const ex of [-0.06, 0.06]) { ctx.beginPath(); ctx.arc(ex * dw, -dh * ay + dh * 0.22, Math.max(1.5, dh * 0.025), 0, 7); ctx.fill(); }
      ctx.restore();
    }
    return true;
  };
  // Single static images (cockpit layers, props, title art). Returns the image once loaded, else null.
  const one = {};
  S.image = function (path) {
    if (!path) return null;
    let r = one[path];
    if (!r) { r = one[path] = { ok: false, failed: false, img: new Image() }; const u = url(path); if (!u) { r.failed = true; return null; } r.img.onload = () => r.ok = true; r.img.onerror = () => r.failed = true; r.img.src = u; }
    return r.ok ? r.img : null;
  };
  // Cockpit layer from a picture, falling back to the drawn layer if the file is missing.
  // fit: 'cover' = whole screen, 'dash' = the dashboard area, 'wheel' = centred on the wheel and turning with it.
  KZ.imageLayer = function (path, fit, fallback) {
    return function (c, G, g) {
      const img = S.image(path); if (!img) return fallback && fallback(c, G, g);
      if (fit === 'wheel') { const w = G.wheel, d = w.R * 2.4; c.translate(w.x, w.y); c.rotate(w.rot); c.drawImage(img, -d / 2, -d / 2 * img.height / img.width, d, d * img.height / img.width); }
      else if (fit === 'dash') c.drawImage(img, 0, G.T - G.D * 0.1, G.W, G.D * 1.1);
      else c.drawImage(img, 0, 0, G.W, G.H);
    };
  };
  S.hitbox = function (type) { const e = KZ.SPRITES[type]; return (e && e.hitbox) || { w: 0.5, h: 0.85 }; };
})();

</script>
<script>
// Sound: drop-in files from the theme's sound manifest (T.sounds), with the built-in generated
// WebAudio sounds as the automatic fallback. Missing or broken files are skipped silently.
(function () {
  let ctx = null, muted = false, engine = null;
  function ac() { if (!ctx) { const A = window.AudioContext || window.webkitAudioContext; if (A) ctx = new A(); } if (ctx && ctx.state === 'suspended') ctx.resume(); return ctx; }
  function tone(f1, f2, dur, type, vol, delay) {
    const c = ac(); if (!c || muted) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + (delay || 0);
    o.type = type || 'square'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(vol || 0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur);
  }
  function noise(dur, vol) {
    const c = ac(); if (!c || muted) return;
    const b = c.createBuffer(1, c.sampleRate * dur, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = c.createBufferSource(), g = c.createGain(); s.buffer = b; g.gain.value = vol || 0.3;
    s.connect(g).connect(c.destination); s.start();
  }
  // ---- drop-in sound files ----
  const files = {}, status = {}, stats = { file: {}, synth: {} };
  const SLOTS = ['engine', 'music', 'splat', 'hit', 'nearMiss', 'pickup', 'golden', 'combo', 'levelUp', 'newBest', 'gameOver', 'click'];
  function load() {
    const man = (KZ.T && KZ.T.sounds) || {};
    for (const slot of SLOTS) {
      let e = man[slot]; if (!e) continue;
      if (typeof e === 'string') e = { file: e };
      const el = new Audio(); el.preload = 'auto'; el.volume = e.volume !== undefined ? e.volume : 0.8;
      el.loop = slot === 'engine' || slot === 'music' || !!e.loop; status[slot] = 'loading';
      el.addEventListener('canplaythrough', () => { if (status[slot] === 'loading') status[slot] = 'ok'; }, { once: true });
      el.addEventListener('error', () => { status[slot] = 'failed'; }, { once: true });   // silently fall back
      const u = KZ.assetUrl ? KZ.assetUrl(e.file) : e.file; if (!u) { status[slot] = 'failed'; continue; }
      el.src = u; files[slot] = el;
    }
  }
  function playFile(slot) {
    if (status[slot] !== 'ok') return false;
    stats.file[slot] = (stats.file[slot] || 0) + 1;
    if (muted) return true;
    const el = files[slot].cloneNode(); el.volume = files[slot].volume;
    const p = el.play(); if (p && p.catch) p.catch(() => {});
    return true;
  }
  function sfx(slot, synth) { if (!playFile(slot)) { stats.synth[slot] = (stats.synth[slot] || 0) + 1; synth(); } }
  function loopFile(slot, on, rate) {
    if (status[slot] !== 'ok') return false;
    const el = files[slot];
    if (on && !muted) { if (rate) { el.preservesPitch = false; el.playbackRate = rate; } if (el.paused) { const p = el.play(); if (p && p.catch) p.catch(() => {}); } }
    else if (!el.paused) el.pause();
    return true;
  }
  KZ.Audio = {
    load, status, stats, playFile,
    unlock() { const c = ac(); loopFile('music', true); return c; },
    splat(combo) { sfx('splat', () => { const f = 260 * ((KZ.T && KZ.T.audio && KZ.T.audio.pitch) || 1) * Math.pow(1.06, Math.min(24, combo || 0)); noise(0.12, 0.2); tone(f * 2, f, 0.14, 'square', 0.1); }); },  // pitch ramps with combo
    pickup() { sfx('pickup', () => [660, 880, 1320].forEach((f, i) => tone(f, f, 0.08, 'square', 0.07, i * 0.06))); },
    fanfare(big) { const n = big ? [523, 659, 784, 1047, 1319] : [784, 988, 1175]; n.forEach((f, i) => tone(f, f, big ? 0.22 : 0.12, 'square', 0.08, i * (big ? 0.12 : 0.07))); },
    combo(n) { sfx('combo', () => tone(500 + n * 120, 900 + n * 150, 0.12, 'square', 0.08)); },
    golden() { sfx('golden', () => KZ.Audio.fanfare()); },
    levelUp() { sfx('levelUp', () => KZ.Audio.fanfare(true)); },
    newBest() { sfx('newBest', () => KZ.Audio.fanfare()); },
    hit() { sfx('hit', () => { noise(0.35, 0.5); tone(180, 40, 0.4, 'square', 0.2); }); },
    over() { sfx('gameOver', () => tone(400, 80, 0.9, 'triangle', 0.2)); },
    whoosh() { sfx('nearMiss', () => { noise(0.15, 0.15); tone(900, 300, 0.15, 'sine', 0.08); }); },
    click() { sfx('click', () => tone(800, 600, 0.05, 'square', 0.06)); },
    setEngine(speed) {
      if (loopFile('engine', !!speed, 0.6 + speed / 100)) return;   // engine sound file: pitch follows speed
      if (!ctx && !speed) return;
      const c = ac(); if (!c) return;
      if (!engine) { const o = c.createOscillator(), g = c.createGain(); o.type = (KZ.T && KZ.T.audio && KZ.T.audio.engine) || 'sawtooth'; g.gain.value = 0; o.connect(g).connect(c.destination); o.start(); engine = { o, g }; }
      engine.o.frequency.setTargetAtTime(40 + speed * 0.9, c.currentTime, 0.1);
      engine.g.gain.setTargetAtTime(muted || !speed ? 0 : 0.025, c.currentTime, 0.1);
    },
    toggleMute() { muted = !muted; for (const k of ['engine', 'music']) if (files[k] && muted) files[k].pause(); if (!muted) loopFile('music', true); if (engine && ctx) engine.g.gain.value = 0; try { localStorage.setItem('kz_muted', muted ? '1' : '0'); } catch (e) {} return muted; },
    get muted() { return muted; }
  };
  try { muted = localStorage.getItem('kz_muted') === '1'; } catch (e) {}
})();

</script>
<script>
// Unified input: keyboard (arrows/A/D), touch (hold halves + swipe), mouse, gamepad.
// Exposes KZ.Input.steer (-1..1) and one-shot actions via KZ.Input.consume(name).
(function () {
  const keys = {}, actions = {};
  let pointerY = 0, pointerSteer = 0, swipeX = null, swipeSteer = 0, swipeTimer = 0, virtual = 0;
  const I = KZ.Input = {
    steer: 0, steerY: 0,         // steerY only used by themes with movement 'xy' (planes)
    virtualSteer: null,           // set by automated tests
    fire(a) { actions[a] = true; },
    consume(a) { const v = actions[a]; actions[a] = false; return !!v; },
    attach(canvas, hud) {
      addEventListener('keydown', e => {
        keys[e.code] = true;
        const st = KZ.game && KZ.game.state;
        if (st === 'title' && (e.code === 'Escape' || e.code === 'KeyQ')) { I.fire('exit'); return; }
        if (st === 'paused' && e.code === 'KeyR') { I.fire('restart'); return; }
        if (st === 'paused' && e.code === 'KeyQ') { I.fire('quit'); return; }
        if (st === 'bye') { I.fire('start'); return; }
        if (e.code === 'KeyP' || e.code === 'Escape') I.fire('pause');
        if (e.code === 'KeyM') I.fire('mute');
        if (e.code === 'KeyH') KZ.DEBUG = !KZ.DEBUG;   // dev: hitbox + anchor outlines
        if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyR') I.fire('start');
        if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
        if (st === 'title' && !['KeyM', 'KeyP', 'KeyH'].includes(e.code)) I.fire('start');
      });
      addEventListener('keyup', e => { keys[e.code] = false; });
      addEventListener('blur', () => { for (const k in keys) keys[k] = false; I.fire('autopause'); });
      document.addEventListener('visibilitychange', () => { if (document.hidden) I.fire('autopause'); });
      const down = (x, y) => {
        const btn = hud.hitButton(x, y); if (btn) { I.fire(btn); return false; }
        I.fire('tap'); const w = canvas.clientWidth, h = canvas.clientHeight; pointerSteer = x < w / 2 ? -1 : 1; swipeX = x;
        pointerY = (KZ.T && KZ.T.movement === 'xy') ? (y < h / 3 ? 1 : y > h * 2 / 3 ? -1 : 0) : 0; return true;
      };
      const move = x => { if (swipeX === null) return; const dx = x - swipeX; if (Math.abs(dx) > 30) { swipeSteer = Math.sign(dx); swipeTimer = 0.18; swipeX = x; pointerSteer = 0; } };
      const up = () => { pointerSteer = 0; pointerY = 0; swipeX = null; };
      canvas.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; down(t.clientX, t.clientY); }, { passive: false });
      canvas.addEventListener('touchmove', e => { e.preventDefault(); move(e.changedTouches[0].clientX); }, { passive: false });
      canvas.addEventListener('touchend', e => { e.preventDefault(); if (!e.touches.length) up(); else { const t = e.touches[0]; pointerSteer = t.clientX < canvas.clientWidth / 2 ? -1 : 1; } }, { passive: false });
      canvas.addEventListener('mousedown', e => down(e.clientX, e.clientY));
      addEventListener('mousemove', e => { if (e.buttons) move(e.clientX); });
      addEventListener('mouseup', up);
    },
    update(dt) {
      let s = 0;
      if (keys.ArrowLeft || keys.KeyA) s -= 1;
      if (keys.ArrowRight || keys.KeyD) s += 1;
      s += pointerSteer;
      if (swipeTimer > 0) { swipeTimer -= dt; s += swipeSteer * 1.5; }
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (const p of pads) {
        if (!p) continue;
        const ax = p.axes[0] || 0; if (Math.abs(ax) > 0.2) s += ax;
        if (p.buttons[14] && p.buttons[14].pressed) s -= 1;
        if (p.buttons[15] && p.buttons[15].pressed) s += 1;
        const b0 = p.buttons[0] && p.buttons[0].pressed, b9 = p.buttons[9] && p.buttons[9].pressed;
        if (b0 && !I._b0) I.fire('start'); if (b9 && !I._b9) I.fire('pause'); I._b0 = b0; I._b9 = b9;
      }

// World entities + fair spawner.
(function () {
  const C = KZ.CONFIG;

  };
  KZ.Pickup = function (type, lane, d) { return { kind: 'pickup', type, x: C.lanes[lane], d, resolved: false, dead: false, t: 0 }; };
  KZ.Decor = function (d) {

    const props = (KZ.scenery(KZ.game).props) || []; if (!props.length) return { kind: 'decor', type: 'none', x: 9, d, scale: 0 };

        dailyList(W / 2, H * 0.64, u);

<script>
// Between-run progression: XP + levels, daily goals + streak, paint unlocks. Saved in localStorage.
(function () {
  const C = KZ.CONFIG; let KEY = 'kz_progress';
  const P = KZ.Progress = {
    data: null,
    load() {
      KEY = (KZ.T && KZ.T.storageKey) || ('kz_progress_' + (KZ.T ? KZ.T.id : 'x'));
      let d = null; try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
      P.data = Object.assign({ xp: 0, best: 0, car: 'pantera-red', daily: null, streak: { count: 0, last: null } }, d || {});
      P.ensureDaily();
    },
    save() { try { localStorage.setItem(KEY, JSON.stringify(P.data)); } catch (e) {} },
    dayStr(off) { const d = new Date(); d.setDate(d.getDate() + (off || 0)); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); },
    need(level) { return 100 + 50 * (level - 1); },                 // XP to go from level -> level+1
    info(xp) {
      let lv = 1, x = xp === undefined ? P.data.xp : xp;
      while (x >= P.need(lv)) { x -= P.need(lv); lv++; }
      return { level: lv, into: x, need: P.need(lv) };
    },
    ensureDaily() {
      const today = P.dayStr();
      if (P.data.daily && P.data.daily.date === today) return;
      let seed = 0; for (const ch of today) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
      const pool = KZ.MISSIONS.map(m => m.id), ids = [];
      while (ids.length < 3) { seed = (seed * 1103515245 + 12345) >>> 0; const id = pool[seed % pool.length]; if (!ids.includes(id)) ids.push(id); }
      P.data.daily = { date: today, ids, done: [] };
      P.save();
    },
    dailyGoals() { P.ensureDaily(); return P.data.daily.ids.map(id => ({ def: KZ.MISSIONS.find(m => m.id === id), done: P.data.daily.done.includes(id) })); },
    // returns newly completed goal defs
    checkDaily(g) {
      const out = [];
      for (const it of P.dailyGoals()) if (!it.done && it.def.done(g)) { P.data.daily.done.push(it.def.id); out.push(it.def); }
      if (out.length && P.data.daily.done.length === 3 && P.data.streak.last !== P.dayStr()) {
        const s = P.data.streak, soft = s.last === P.dayStr(-1) || s.last === P.dayStr(-2);   // 1-day grace (soft reset)
        s.count = soft ? s.count + 1 : 1; s.last = P.dayStr(); out.allDone = true;
      }
      if (out.length) P.save();
      return out;
    },
    addXP(n) { const before = P.info().level; P.data.xp += n; P.save(); return { before, after: P.info().level }; },
    cars() { const lv = P.info().level; return KZ.CARS.map(c => Object.assign({ locked: c.unlock > lv }, c)); },
    car() { const cs = P.cars(); return cs.find(c => c.id === P.data.car && !c.locked) || cs[0]; },
    pickCar(id) { const c = P.cars().find(c => c.id === id); if (c && !c.locked) { P.data.car = id; P.save(); return true; } return false; }
  };
})();

<script>
// Game state + rules. No drawing here.
(function () {
  const C = KZ.CONFIG, P = KZ.Progress, S = KZ.s;
  KZ.Game = function () {
    const g = {
      state: 'title', // title | garage | playing | paused | over
      entities: [], particles: [], popups: [],
      spawner: KZ.Spawner(),
      get best() { return P.data.best; },
      reset() {
        Object.assign(g, { score: 0, lives: C.lives, combo: 0, comboTimer: 0, zombies: 0, time: 0, dist: 0,
          speed: C.startSpeed, difficulty: 0, px: 0, steerVis: 0, inv: 0, shake: 0, curve: 0, curveT: 0, hill: 0,
          entities: [], particles: [], popups: [], newBest: false, passedBest: false, nearMisses: 0, slowmo: 0,
          pickups: 0, goldens: 0, levelIdx: 0, py: 0, nitro: 0, magnet: 0, shield: false, xpGain: 0, xpBefore: P.data.xp, levelUp: null, dailyDone: [] });
        for (let d = 10; d < C.drawDistance; d += 12) g.entities.push(KZ.Decor(d));
        g.spawner.reset();
      },
      start() { g.reset(); g.state = 'playing'; KZ.Audio.click(); },
      multiplier() { return Math.min(C.comboMax, 1 + Math.floor(g.combo / C.comboStep)); },
      car() { return P.car(); },
      add(pts) { if (g.state !== 'playing') return 0; const v = pts * (g.magnet > 0 ? 2 : 1); g.score += v; return v; },
      pop(text, color, y, life) { g.popups.push({ text, x: 0.5, y: y || 0.42, life: life || 0.9, color }); },
      update(dt) {
        g.anim = (g.anim || 0) + dt;
        if (g.state !== 'playing') { KZ.Audio.setEngine(0); return; }
        g.time += dt;
        g.difficulty = Math.min(1, g.time / C.difficultyTime);
        const lvls = KZ.T.levels || [];                       // level up by distance
        if (g.levelIdx + 1 < lvls.length && g.dist >= lvls[g.levelIdx + 1].distance) {
          g.levelIdx++; const lv = lvls[g.levelIdx]; KZ.Audio.levelUp();
          g.pop(S('levelBanner', { n: g.levelIdx + 1, name: lv.name }), '#ffffff', 0.3, 2.2);
        }
        g.nitro = Math.max(0, g.nitro - dt); g.magnet = Math.max(0, g.magnet - dt);
        g.speed = Math.min(C.maxSpeed, C.startSpeed + C.speedRamp * g.time) * (KZ.level(g.levelIdx).speedMul || 1) * (g.nitro > 0 ? C.nitroBoost : 1);
        const move = g.speed * dt;
        g.dist += move; g.add(move * C.distancePointsPerUnit);
        g.steerVis += (KZ.Input.steer - g.steerVis) * Math.min(1, dt * 10);
        g.px = Math.max(-1, Math.min(1, g.px + g.steerVis * C.steerSpeed * dt));
        if (KZ.T.movement === 'xy') g.py = Math.max(0, Math.min(1, g.py + KZ.Input.steerY * C.steerSpeed * 0.6 * dt));   // planes: up/down
        g.curveT += dt * 0.15; g.curve = Math.sin(g.curveT) * 1.1 * Math.sin(g.curveT * 0.37); g.hill = Math.sin(g.curveT * 0.7) * 0.5;
        g.inv = Math.max(0, g.inv - dt); g.shake = Math.max(0, g.shake - dt);
        if (g.combo && (g.comboTimer -= dt) <= 0) g.combo = 0;
        g.spawner.update(dt, g);
        for (const e of g.entities) {
          e.d -= move;
          if (e.kind === 'decor') continue;
          e.t = (e.t || 0) + dt;
          if (e.dying) { e.dying += dt; if (e.dying > 0.7) e.dead = true; continue; }
          if (e.wander && !e.resolved) e.x += Math.sin(e.t * 2) * 0.08 * dt;
          if (!e.resolved && e.d <= C.hitDepth && e.d > -1) {
            e.resolved = true;
            const gap = Math.abs(e.x - g.px) + (KZ.T.movement === 'xy' ? Math.abs((e.y || 0) - g.py) : 0);
            if (e.kind === 'pickup') { if (gap < C.hitWidth + 0.08) g.grab(e); }
            else if (gap < ((KZ.SPRITES[e.type] && KZ.SPRITES[e.type].hitWidth) || C.hitWidth)) g.collide(e);
            else if (!e.zombie && gap < C.nearMissWidth) g.nearMiss(e);
          }
        }
        g.entities = g.entities.filter(e => e.d > -2 && !e.dead);
        for (const p of g.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 1.4 * dt; p.life -= dt; }
        g.particles = g.particles.filter(p => p.life > 0);
        for (const p of g.popups) { p.life -= dt; p.y -= 0.08 * dt; }
        g.popups = g.popups.filter(p => p.life > 0);
        if (!g.passedBest && g.best > 0 && g.score > g.best) { g.passedBest = true; g.pop(S('newBest'), '#ffe27a', 0.3, 1.6); KZ.Audio.newBest(); g.burst('#ffe27a', 30); }
        const nd = P.checkDaily(g);
        for (const d of nd) { g.dailyDone.push(d); g.pop(S('dailyDone'), '#ffe27a', 0.26, 1.6); KZ.Audio.fanfare(); }
        if (nd.allDone) g.pop(S('allDaily', { n: P.data.streak.count }), '#ffb347', 0.2, 2);
        KZ.Audio.setEngine(g.speed);
      },
      nearMiss() { g.nearMisses++; const v = g.add(C.nearMissPoints); KZ.Audio.whoosh(); g.pop(S('closeOne', { n: v }), '#7fd4ff', 0.36, 0.8); },
      grab(e) {
        e.dead = true; g.pickups++; KZ.Audio.pickup();
        const pd = KZ.T.pickups[e.type] || {}, fx = pd.effect || e.type;    // effects: nitro | shield | magnet
        if (fx === 'nitro') g.nitro = C.nitroTime;
        if (fx === 'shield') g.shield = true;
        if (fx === 'magnet') g.magnet = C.magnetTime;
        g.pop(pd.text || e.type, pd.color || '#fff');
        g.burst('#ffffff', 16);
      },
      collide(e) {
        if (g.state !== 'playing') return;      // nothing counts after game over (same-frame hits)
        if (e.zombie) {
          e.dead = true; g.entities.push(Object.assign({}, e, { dead: false, dying: 0.001, resolved: true })); g.combo++; g.comboTimer = C.comboTimeout; g.zombies++;
          const m = g.multiplier();
          if (e.golden) {
            g.goldens++; const v = g.add(C.goldenPoints * m); g.slowmo = C.slowmoTime; KZ.Audio.golden();
            g.pop(S('golden', { n: v }), KZ.T.colors.golden, 0.4, 1.4); g.burst(KZ.T.colors.golden, 40); g.burst('#fff6b0', 20);
          } else {
            const v = g.add(((KZ.T.creatures[e.type] || {}).points || C.zombiePoints) * m); g.pop(S('hitTarget', { n: v }) + (m > 1 ? '  x' + m : ''), KZ.T.colors.accent, 0.45);
            g.burst(KZ.T.colors.goo[0], 26); g.burst(KZ.T.colors.goo[1], 14);   // cartoon goo/feathers, no gore
          }
          KZ.Audio.splat(g.combo); g.shake = Math.max(g.shake, 0.12);
          if (g.combo % C.comboStep === 0 && m > 1) { KZ.Audio.combo(m); if (m >= 3) g.slowmo = C.slowmoTime; }
        } else {
          if (g.inv > 0 || g.nitro > 0) { e.dead = true; return; }
          e.dead = true; g.combo = 0; g.shake = C.shakeTime; g.inv = C.invincibleTime;
          if (g.shield) { g.shield = false; KZ.Audio.whoosh(); g.pop(S('shieldSaved'), '#5ac8ff', 0.4, 1.2); return; }
          g.lives--; KZ.Audio.hit(); g.burst('#ffffff', 14);
          g.pop(S('oops', { name: (KZ.T.creatures[e.type] || {}).name || e.type }), '#ff6a5a', 0.4, 1.2);
          if (g.lives <= 0) g.gameOver();
        }
      },
      burst(color, n) { for (let i = 0; i < n; i++) g.particles.push({ x: 0.5, y: 0.5, vx: (Math.random() - 0.5) * 0.9, vy: -Math.random() * 0.8, life: 0.6 + Math.random() * 0.4, color }); },
      gameOver() {
        g.state = 'over'; KZ.Audio.over(); g.overTime = 0;
        g.score = Math.floor(g.score);
        if (g.score > P.data.best) { g.newBest = true; P.data.best = g.score; }
        g.xpBefore = P.data.xp;
        g.xpGain = Math.round(g.score * C.xpPerScore + g.zombies * C.xpPerZombie + g.dailyDone.length * C.xpPerDaily);
        const lv = P.addXP(g.xpGain);
        g.levelUp = lv.after > lv.before ? lv : null;
        if (g.levelUp) setTimeout(() => KZ.Audio.levelUp(), 900);
      }
    };
    g.reset();
    return g;
  };
})();

// SPRITE MANIFEST (KangaZombie theme): the one file to edit when adding art. See docs/ART-GUIDE.md.
// Plain JS (not JSON) so it works when index.html is double-clicked.
//
// Each entry (key = folder name in themes/kangazombie/sprites/):
//   image:   'themes/kangazombie/sprites/kangaroo/kangaroo.png'  a sprite sheet (single row or grid)
//   OR frames: 'themes/kangazombie/sprites/kangaroo/run_{i}.png', count: 10   individual numbered frames (run_0.png, run_1.png, ...)
//   frameW, frameH: size of ONE frame in pixels
//   cols:    frames per row (optional; worked out from the image width)
//   atlas:   optional Aseprite / TexturePacker JSON, pasted in as an object ({ frames: ... })
//   anims:   { run: { from: 0, to: 5, fps: 12 }, splat: { from: 6, to: 9, fps: 14, loop: false }, idle: { from: 0, to: 0 } }
//   anchor:  [x, y] foot point as a fraction of the frame (0.5, 0.95 = bottom middle)
//   scale:   1 = same size as the placeholder
//   hitbox:  { w, h } as a fraction of the frame (shown with the H key); hitWidth = road units for collisions (optional)
//   tint:    true on a *_zombie entry = no art needed: re-use the normal sprite with a green tint + glowing eyes
//   enabled: false = ignore this entry and use the code-drawn placeholder
// Anything missing or failing to load falls back to the code-drawn placeholder automatically.
(function () {
  const BASE = 'themes/kangazombie/sprites/';
  const animal = (name, w, h, enabled) => ({
    image: BASE + name + '/' + name + '.png', frameW: w, frameH: h,
    anims: { run: { from: 0, to: 5, fps: 12 }, splat: { from: 6, to: 9, fps: 14, loop: false }, idle: { from: 0, to: 0 } },

<script>
// Boot + main loop. Wraps cleanly in Capacitor (it just loads index.html).
(function () {
  const canvas = document.getElementById('game');
  KZ.selectTheme(); KZ.Progress.load();
  const game = KZ.Game(), renderer = KZ.Renderer(canvas);
  KZ.game = game; KZ.renderer = renderer;
  KZ.Sprites.load(); KZ.Audio.load();
  KZ.Input.attach(canvas, renderer);
  renderer.resize(); addEventListener('resize', renderer.resize);
  let last = performance.now();
  function step(dt) {
    KZ.Input.update(dt);
    if (KZ.Input.consume('mute')) KZ.Audio.toggleMute();
    if (KZ.Input.consume('share')) KZ.share();
    if (KZ.Input.consume('garage') && (game.state === 'title' || game.state === 'over')) { game.state = 'garage'; KZ.Audio.click(); KZ.Input.consume('start'); }
    if (KZ.Input.consume('back') && game.state === 'garage') { game.state = 'title'; KZ.Audio.click(); KZ.Input.consume('start'); return; }
    for (const c of KZ.CARS) if (KZ.Input.consume('car:' + c.id) && KZ.Progress.pickCar(c.id)) KZ.Audio.pickup();
    const pause = KZ.Input.consume('pause'), auto = KZ.Input.consume('autopause'), tap = KZ.Input.consume('tap');
    // pointer taps start/restart the game, but never un-pause by accident (use the menu)
    const start = KZ.Input.consume('start') || (tap && game.state !== 'paused');
    // pause menu + exit
    if (KZ.Input.consume('resume') && game.state === 'paused') game.state = 'playing';
    if (KZ.Input.consume('restart') && game.state === 'paused') { game.start(); return; }
    if (KZ.Input.consume('quit') && (game.state === 'paused' || game.state === 'over')) { game.reset(); game.state = 'title'; KZ.Audio.click(); return; }
    if (KZ.Input.consume('exit') && game.state === 'title') { KZ.exit(); return; }
    if (game.state === 'bye') { if (start) game.state = 'title'; game.update(dt); return; }
    if (start || pause) KZ.Audio.unlock();
    if (game.state === 'over') game.overTime = (game.overTime || 0) + dt; else game.overTime = 0;
    if (game.state === 'garage') KZ.Input.consume('start');
    else if (game.state === 'title' && start) game.start();
    else if (game.state === 'over' && start && game.overTime > KZ.CONFIG.restartDelay) game.start();
    else if (game.state === 'playing' && (pause || (auto && !KZ.TEST))) game.state = 'paused';
    else if (game.state === 'paused' && (pause || start)) game.state = 'playing';
    let sdt = dt; if (game.slowmo > 0) { game.slowmo -= dt; sdt = dt * KZ.CONFIG.slowmoScale; }
    game.update(sdt);
  }
  KZ.step = step;
  // Exit: browsers only let a script close a tab it opened itself, so try, then show a goodbye screen.
  KZ.exit = function () {
    KZ.Audio.setEngine(0); game.state = 'bye';
    try { window.close(); } catch (e) {}
  };
  // Share your score: the game-over screen as a PNG, via the native share sheet or a download.
  KZ.share = function () {
    canvas.toBlob(blob => {
      if (!blob) return;
      const file = new File([blob], (KZ.T.id + '-score.png'), { type: 'image/png' }), text = KZ.s('shareText', { n: game.score });
      if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], text }).catch(() => {});
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click(); }
    });
  };
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    step(dt); renderer.draw(game);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
