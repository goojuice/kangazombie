<script>(function(){var fns=[],ov=document.getElementById('kzPauseOv'),P=window.kzPause={paused:false,onChange:function(f){fns.push(f)},
pause:function(){if(P.paused)return;P.paused=true;ov.classList.add('on');fns.forEach(function(f){f(true)})},
resume:function(){if(!P.paused)return;P.paused=false;ov.classList.remove('on');fns.forEach(function(f){f(false)})}};
function stop(e){e.stopPropagation()}['pointerdown','touchstart','mousedown'].forEach(function(t){document.getElementById('kzPause').addEventListener(t,stop);ov.addEventListener(t,stop)});
document.getElementById('kzPause').onclick=function(){P.paused?P.resume():P.pause()};document.getElementById('kzResume').onclick=function(){P.resume()};
document.addEventListener('visibilitychange',function(){if(document.hidden)P.pause()});addEventListener('pagehide',function(){P.pause()});
addEventListener('keydown',function(e){if(e.code==='Escape'&&P.paused){e.stopImmediatePropagation();P.resume()}},true);})();</script>

<script>
'use strict';
/* =========================== Chook Patrol =========================== *
 * A country backyard: barn, fence, coop and five chooks.
 * Feed mode: toss grain, the chooks gobble it and lay eggs, tap eggs to collect.
 * Patrol mode: a fox, a goanna and a wedge-tailed eagle try to sneak off with a chook.
 * Squirt them with the water cannon and they slink off dripping and grumpy.
 * Nobody gets hurt: a carried-off chook gets dropped or flaps home a bit later. */

/* ----------------------------- config + themes ----------------------------- */
const CONFIG = {
  roundTime: 60,
  feed: { cooldown: 0.3, grains: 7, notice: 260, eatTime: 0.35, layAfter: 5, eggLife: 9, eggPts: 25, goldenPts: 100, grainPts: 5 },
  patrol: { sprayRate: 28, dropT: 0.28 },
  predators: {   // need = water drops to soak, speed in px/s at depth 1, pts when shooed
    fox:    { name: 'Fox',    need: 16, speed: 78, pts: 100 },
    goanna: { name: 'Goanna', need: 26, speed: 42, pts: 150 },
    eagle:  { name: 'Wedgie', need: 12,  speed: 0,  pts: 200 }
  },
  rescuePts: 50, safeBonus: 50,
  medals: {
    // set from the tests.js bot sims; tune after real kids play
    feed:   [ { id: 'bronze', name: 'Bronze', at: 800 }, { id: 'silver', name: 'Silver', at: 2000 }, { id: 'gold', name: 'Gold', at: 4000 } ],
    patrol: [ { id: 'bronze', name: 'Bronze', at: 2000 }, { id: 'silver', name: 'Silver', at: 5000 }, { id: 'gold', name: 'Gold', at: 9000 } ]
  }
};
const CHOOKS = [
  { name: 'Clucky', body: '#c8743a', wing: '#a85a26' }, { name: 'Nugget', body: '#ffffff', wing: '#e3e3ea' },
  { name: 'Pecky', body: '#2b2b38', wing: '#3d4a5c' }, { name: 'Goldie', body: '#f2b03a', wing: '#d68f1f' }, { name: 'Henny', body: '#8a6a52', wing: '#6e523e' }
];
const THEMES = [
  { id: 'arvo', name: 'Sunny arvo', sky: ['#5ec8ff', '#d4f3ff'], hill: '#8fd45a', grass: '#7cc94a', grass2: '#6cb83c', dirt: '#d9b47a', barn: '#d8483a', sun: '#ffe94d' },
  { id: 'sunset', name: 'Sunset', sky: ['#ff7a59', '#ffd29a'], hill: '#b9a55a', grass: '#a3b84e', grass2: '#8fa443', dirt: '#d8a36a', barn: '#c23a34', sun: '#fff1a8' }
];

/* ad / portal seams (playbook #34): a portal SDK can hook these later. Nothing is sent anywhere. */
const hook = name => { try { window.kzHooks && window.kzHooks[name] && window.kzHooks[name](); } catch (e) {} };

/* ----------------------------- storage ----------------------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('chookPatrol.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('chookPatrol.' + k, JSON.stringify(v)); } catch (e) {} }
};
const littleKidsGet = () => { try { return localStorage.getItem('kzArcade.littleKids') === '1'; } catch (e) { return false; } };
const littleKidsSet = v => { try { localStorage.setItem('kzArcade.littleKids', v ? '1' : '0'); } catch (e) {} };

/* ----------------------------- state ----------------------------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const G = {
  phase: 'title', mode: store.get('mode', 'feed'), paused: false, sound: store.get('sound', true), themeIx: store.get('theme', 0) % THEMES.length,
  littleKids: littleKidsGet(), best: { feed: store.get('best.feed', 0), patrol: store.get('best.patrol', 0) },
  W: 960, H: 540, L: {}, t: 0, time: 0, score: 0, combo: 0, lastScore: -9, bestCombo: 0,
  chooks: [], grains: [], eggs: [], preds: [], drops: [], puddles: [], aim: { x: 480, y: 380, show: false }, cool: 0,
  spraying: false, spawnT: 0, stats: {}
};
const theme = () => THEMES[G.themeIx];
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

/* ----------------------------- layout ----------------------------- */
let DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const cw = innerWidth, ch = innerHeight;
  cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
  if (cw >= ch) { G.H = 540; G.W = Math.round(540 * cw / ch); } else { G.W = 540; G.H = Math.round(540 * ch / cw); }
  const W = G.W, H = G.H, port = H > W, L = G.L;
  L.port = port;
  L.horizon = H * (port ? 0.27 : 0.30);
  L.fence = H * (port ? 0.34 : 0.40);       // back fence line
  L.yTop = H * (port ? 0.38 : 0.45);        // yard area chooks can walk in
  L.yBot = H * (port ? 0.78 : 0.86);
  L.xMin = 40; L.xMax = W - 40;
  L.gunX = W / 2; L.gunY = H * (port ? 0.92 : 0.99);
  L.coop = { x: W * (port ? 0.78 : 0.84), gy: L.yTop + 4 };
  L.barn = { x: W * (port ? 0.2 : 0.13), gy: L.fence + 6 };
  L.hudY = port ? Math.max(118, 66 * H / innerHeight + 34) : 34;
}
const depth = gy => clamp(0.7 + 0.45 * (gy - G.L.yTop) / (G.L.yBot - G.L.yTop), 0.62, 1.2) * (G.L.port ? 1.28 : 1);

/* ----------------------------- chooks ----------------------------- */
function makeChooks() {
  const L = G.L; G.chooks = CHOOKS.map((c, i) => ({ ...c, i, x: lerp(L.xMin + 80, L.xMax - 80, (i + 0.5) / CHOOKS.length) + rnd(-30, 30), gy: rnd(L.yTop + 30, L.yBot - 30),
    tx: 0, ty: 0, state: 'wander', st: rnd(0, 2), face: Math.random() < 0.5 ? -1 : 1, fed: 0, happy: 0, z: 0, carrier: null, step: 0 }));
  for (const c of G.chooks) pickWander(c);
}
function pickWander(c) { const L = G.L; c.tx = clamp(c.x + rnd(-160, 160), L.xMin, L.xMax); c.ty = clamp(c.gy + rnd(-80, 80), L.yTop + 10, L.yBot - 10); c.st = 0; c.state = 'wander'; }
function updateChooks(dt) {
  const L = G.L;
  for (const c of G.chooks) {
    c.st += dt; c.happy = Math.max(0, c.happy - dt); c.hop = Math.max(0, (c.hop || 0) - dt * 4);
    if (c.state === 'carried') { const p = c.carrier; c.x = p.x + (p.kind === 'eagle' ? 0 : -p.face * 22); c.gy = p.gy + 2; c.z = p.kind === 'eagle' ? p.z - 20 : 14; c.face = p.face; continue; }
    if (c.state === 'away') { if (c.st > 4) { c.state = 'flutter'; c.st = 0; c.x = c.awayX; c.gy = rnd(L.yTop + 30, L.yBot - 40); c.z = 120; c.tx = clamp(c.x, L.xMin + 60, L.xMax - 60); c.ty = c.gy; sfx('squawkHappy'); Juice.pop(c.x, c.gy - 170, c.name + ' is home!', '#7be36b', 24, 1.2); } continue; }
    if (c.state === 'flutter') {   // dropped or flapping home: float down gently, then carry on
      c.z = Math.max(0, c.z - 160 * dt); c.x += (c.tx - c.x) * Math.min(1, dt * 2); if (c.z <= 0) { c.z = 0; pickWander(c); c.happy = 1; } continue; }
    if (c.state === 'lay') { if (c.st > 0.8) { layEgg(c); pickWander(c); } continue; }
    if (c.state === 'eat') { if (c.st > CONFIG.feed.eatTime) { c.state = 'wander'; c.st = 0; c.tx = c.x; c.ty = c.gy; } continue; }
    // find food (feed mode)
    let target = null;
    if (G.mode === 'feed') { let bd = CONFIG.feed.notice * (G.littleKids ? 1.4 : 1); for (const g of G.grains) if (g.landed && !g.taken) { const d = dist(c.x, c.gy, g.x, g.gy); if (d < bd) { bd = d; target = g; } } }
    let speed = 55;
    if (target) { c.tx = target.x; c.ty = target.gy; speed = 120; c.state = 'run'; }
    else if (G.mode === 'patrol' && G.preds.some(p => p.target === c && p.state !== 'soaked' && dist(p.x, p.gy, c.x, c.gy) < 160)) {   // scared: scurry towards the coop
      if (c.state !== 'run') { c.tx = L.coop.x + rnd(-60, 20); c.ty = L.coop.gy + 20; } speed = G.littleKids ? 62 : 50; c.state = 'run';
    }
    const d = dist(c.x, c.gy, c.tx, c.ty);
    if (d > 4) { const sp = speed * depth(c.gy); c.x += (c.tx - c.x) / d * sp * dt; c.gy += (c.ty - c.gy) / d * sp * dt; c.face = c.tx < c.x ? -1 : 1; c.step += dt * (speed / 10); }
    else if (target) { target.taken = true; c.state = 'eat'; c.st = 0; c.fed++; c.happy = 0.8; heart(c.x + c.face * 12, c.gy - 50 * depth(c.gy)); c.hop = 1; G.score += CONFIG.feed.grainPts; G.stats.grains++; sfx('cluck'); pop(c.x, c.gy - 60, '+' + CONFIG.feed.grainPts, '#fff');
      if (c.fed >= CONFIG.feed.layAfter * (G.littleKids ? 0.75 : 1)) { c.fed = 0; c.state = 'lay'; c.st = 0; sfx('bagawk'); } }
    else if (c.state === 'wander' && c.st > rnd(1.5, 3.5)) { if (Math.random() < 0.5) { c.state = 'peck'; c.st = 0; } else pickWander(c); }
    else if (c.state === 'peck' && c.st > 1.2) pickWander(c);
    else if (c.state === 'run') pickWander(c);
    c.x = clamp(c.x, L.xMin, L.xMax); c.gy = clamp(c.gy, L.yTop, L.yBot);
    if (Math.random() < dt * 0.15) sfx('cluckSoft');
  }
}

/* ----------------------------- feed mode ----------------------------- */
function throwFeed(sx, sy) {
  const L = G.L, tx = clamp(sx, L.xMin, L.xMax), ty = clamp(sy, L.yTop, L.yBot);
  for (let i = 0; i < CONFIG.feed.grains; i++) { const a = Math.random() * 6.283, r = Math.sqrt(Math.random()) * 34;
    G.grains.push({ x0: L.gunX, y0: L.gunY - 40, x: L.gunX, gy: L.gunY - 40, tx: tx + Math.cos(a) * r, ty: clamp(ty + Math.sin(a) * r * 0.5, L.yTop, L.yBot), t: -i * 0.015, T: 0.45, z: 0, landed: false, taken: false, life: 9 }); }
  G.stats.throws++; G.cool = CONFIG.feed.cooldown; sfx('toss');
}
function layEgg(c) {
  const golden = Math.random() < 0.12;
  G.eggs.push({ x: c.x - c.face * 6, gy: c.gy + 2, golden, life: CONFIG.feed.eggLife, pop: 1 });
  Juice.pop(c.x, c.gy - 70, golden ? 'Golden egg!' : 'Egg!', golden ? '#ffe11a' : '#fff', golden ? 30 : 24); sfx('plink'); if (golden) { sfx('golden'); Juice.burst(c.x, c.gy - 12, 14, ['#ffe11a', '#fff7b0'], { shape: 'star', speed: 160, up: 120, size: 5 }); }
  Juice.burst(c.x, c.gy - 6, 6, ['#ffffff', '#f3e6c8'], { speed: 90, up: 70, size: 3, life: 0.5 });
}
function collectEgg(e) {
  e.taken = true; const pts = e.golden ? CONFIG.feed.goldenPts : CONFIG.feed.eggPts;
  G.combo = (G.t - G.lastScore < 4) ? G.combo + 1 : 1; G.lastScore = G.t; G.bestCombo = Math.max(G.bestCombo, G.combo);
  const total = pts * Math.min(2, G.combo); G.score += total; G.stats.eggs++; if (e.golden) G.stats.golden++;
  Juice.pop(e.x, e.gy - 40, '+' + total, e.golden ? '#ffe11a' : '#fff', 26 + 3 * Math.min(3, G.combo)); sfx('coin');
  Juice.burst(e.x, e.gy - 10, 12, e.golden ? ['#ffe11a', '#fff7b0', '#ffffff'] : ['#fffaf0', '#ffe11a', '#7be36b'], { shape: 'star', speed: 220, up: 140, size: 4 }); Juice.trauma(0.08);
  if (G.combo === 3) Juice.burst(G.W / 2, 60, 24, ['#ffe11a', '#ff4d6d', '#3ec5ff', '#7be36b'], { shape: 'confetti', speed: 380, up: 100, g: 400, life: 1.3, size: 7 });
}
function updateFeed(dt) {
  for (const g of G.grains) {
    if (!g.landed) { g.t += dt; const u = clamp(g.t / g.T, 0, 1); g.x = lerp(g.x0, g.tx, u); g.gy = lerp(g.y0, g.ty, u); g.z = 140 * 4 * u * (1 - u); if (u >= 1) { g.landed = true; g.z = 0; if (Math.random() < 0.3) Juice.burst(g.x, g.gy, 2, ['#d9b47a', '#c9a46a'], { speed: 40, up: 30, size: 2.5, life: 0.4 }); } }
    else g.life -= dt;
  }
  G.grains = G.grains.filter(g => !g.taken && g.life > 0);
